# unmask-plugin-nginx (fat variant) — bundles .so files for multiple nginx
# versions in a single package.
#
# postinstall picks and cp's the .so matching the host nginx out of the bundle.
# When the host runs an ABI-compatible version (= same minor branch / patch),
# the closest match is used.
#
# Bundled versions are everything sitting under build/multi-modules/.  Run
# `make build-module-multi` to build them all first, then package.

name: unmask-plugin-nginx
arch: ${UNMASK_ARCH}
platform: linux
version: ${UNMASK_VERSION}
section: net
priority: optional
maintainer: unmask maintainers <oss@unmask.sh>
description: |
  unmask nginx native module (= ngx_http_unmask_module.so).
  Provides JA4 TLS fingerprint extraction and full native-mode features.
  Bundles modules for multiple nginx versions; postinstall picks the one
  matching the host nginx automatically.
  Requires the unmask main package and a host nginx with --with-compat.
vendor: unmask
homepage: https://github.com/unmask-sh/unmask
license: Apache-2.0

rpm:
  group: System Environment/Daemons
  signature:
    key_file: ${NFPM_RPM_KEY_FILE:-}

deb:
  fields:
    Vcs-Browser: https://github.com/unmask-sh/unmask

apk:
  signature:
    key_file: ${NFPM_APK_KEY_FILE}
    key_name: ${NFPM_APK_KEY_NAME}

depends:
  - unmask

scripts:
  preinstall: ./scripts/preinstall-plugin-nginx-fat.sh
  postinstall: ./scripts/postinstall-plugin-nginx-fat.sh
  preremove: ./scripts/preremove-plugin-nginx.sh

# The Makefile's package-plugin-nginx-fat target walks the build-module-multi
# output (= dist/multi-modules/<X.Y.Z>/ngx_http_unmask_module.so), appends entries
# below, then invokes nfpm pkg.  This file is valid yaml even when empty.
contents:

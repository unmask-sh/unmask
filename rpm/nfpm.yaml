# nfpm config — rpm / deb / apk を一つの config からビルド.
#
#   nfpm pkg --packager rpm --target dist/
#   nfpm pkg --packager deb --target dist/
#   nfpm pkg --packager apk --target dist/
#
# build pipeline では先に `make build-all` で
#   - dist/unmask-admin-linux-amd64
#   - dist/ngx_http_ja4_module-linux-amd64.so
# を生成しておくこと.

name: unmask
arch: amd64
platform: linux
version: ${UNMASK_VERSION:-0.1.0}
section: net
priority: optional
maintainer: unmask maintainers <oss@example.com>
description: |
  unmask — JA4 TLS-fingerprint based bot challenge for nginx.
  Bundles a dynamic nginx module, an admin server (Go static binary),
  and the challenge HTML / config snippets.
vendor: unmask
homepage: https://github.com/unmask-sh/unmask
license: Apache-2.0

# rpm 限定の細かい設定
rpm:
  group: System Environment/Daemons
  signature:
    key_file: ${NFPM_RPM_KEY_FILE:-}

# deb 限定
deb:
  fields:
    Vcs-Browser: https://github.com/unmask-sh/unmask

depends:
  # nginx は user 自前 install の前提 (= module を load_module で追加する).
  # config snippet 配布のためここでは依存指定しない. 依存に入れるとユーザの
  # nginx 構成 (compile from source / openresty 等) と衝突する可能性がある.

contents:
  # admin server
  - src: ../dist/unmask-admin-linux-amd64
    dst: /usr/sbin/unmask-admin
    file_info:
      mode: 0755

  # ja4 nginx module (dynamic module .so)
  - src: ../dist/ngx_http_ja4_module-linux-amd64.so
    dst: /usr/lib/nginx/modules/ngx_http_ja4_module.so
    file_info:
      mode: 0644

  # nginx config snippets (= /etc/unmask/nginx/ 配下に置く. user は
  #   include /etc/unmask/nginx/unmask.conf;
  # で取り込む)
  - src: ../nginx/unmask.conf
    dst: /etc/unmask/nginx/unmask.conf
    type: config|noreplace
  - src: ../nginx/unmask-server.conf
    dst: /etc/unmask/nginx/unmask-server.conf
    type: config|noreplace
  - src: ../nginx/search-bots.conf
    dst: /etc/unmask/nginx/search-bots.conf
    type: config|noreplace
  - src: ../nginx/google-ip.conf
    dst: /etc/unmask/nginx/google-ip.conf
    type: config|noreplace
  - src: ../nginx/ja4-verdict.map
    dst: /etc/unmask/nginx/ja4-verdict.map
    type: config|noreplace
  - src: ../nginx/secret.conf.example
    dst: /etc/unmask/nginx/secret.conf.example

  # challenge HTML (admin app は embed 版を持つが、 ops が編集できる外側にも置く)
  - src: ../challenge/bot-challenge.html
    dst: /usr/share/unmask/challenge/bot-challenge.html

  # systemd
  - src: ./unmask-admin.service
    dst: /usr/lib/systemd/system/unmask-admin.service
  - src: ./unmask-aggregate.service
    dst: /usr/lib/systemd/system/unmask-aggregate.service
  - src: ./unmask-aggregate.timer
    dst: /usr/lib/systemd/system/unmask-aggregate.timer

  # logrotate
  - src: ./unmask-admin.logrotate
    dst: /etc/logrotate.d/unmask-admin

  # man (TODO)
  # - src: ../docs/unmask-admin.1
  #   dst: /usr/share/man/man1/unmask-admin.1.gz

  # state directories (空ディレクトリだけ作る)
  - dst: /var/lib/unmask
    type: dir
    file_info:
      mode: 0750
      owner: unmask
      group: unmask
  - dst: /var/log/unmask
    type: dir
    file_info:
      mode: 0750
      owner: unmask
      group: unmask
  - dst: /etc/unmask
    type: dir
    file_info:
      mode: 0755

scripts:
  preinstall: ./scripts/preinstall.sh
  postinstall: ./scripts/postinstall.sh
  preremove: ./scripts/preremove.sh
  postremove: ./scripts/postremove.sh

# nginx.service drop-in shipped by unmask-plugin-nginx.
#
# Before nginx starts, the unmask module is picked for the nginx on the host
# (unmask-place-module.service runs place-module.sh).  This closes the
# host-nginx-upgrade .so orphan: when the host upgrades nginx (= routine
# `yum/apt upgrade`), the bundled .so matching the new version is re-selected
# -- or the module is fail-safe-disabled if none matches -- so nginx never
# tries to load an ABI-incompatible .so and fail to start.
#
# Wanted and ordered before this unit, not an ExecStartPre= here: a drop-in's
# ExecStartPre= runs after the unit's own, and a distribution's nginx.service
# tests the configuration in its own (nginx -t), which a module left from the
# old version fails before the placer is reached.  Wanted, not required:
# nginx starts whatever becomes of the placing.
[Unit]
Wants=unmask-place-module.service
After=unmask-place-module.service

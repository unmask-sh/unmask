# nginx.service drop-in shipped by unmask-plugin-nginx.
#
# Re-picks the unmask native module for the RUNNING nginx version before nginx
# starts.  This closes the host-nginx-upgrade .so orphan: when the host upgrades
# nginx (= routine `yum/apt upgrade`), the bundled .so matching the new version
# is re-selected -- or the module is fail-safe-disabled if none matches -- so
# nginx never tries to load an ABI-incompatible .so and fail to start.
#
# ExecStartPre is prefixed '-' so a placer error can never itself block nginx
# from starting (the placer also degrades gracefully internally).
[Service]
ExecStartPre=-/bin/sh /usr/share/unmask/plugin/place-module.sh

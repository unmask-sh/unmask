<!DOCTYPE html>
<html lang="{{ .Lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>unmask — {{ t .Lang "forgot.title" }}</title>
<link rel="icon" type="image/png" href="/unmask/static/icon.png">
<link rel="apple-touch-icon" href="/unmask/static/icon.png">
<style>
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center;
  background: #0f172a; color: #e2e8f0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
.card {
  background: #1e293b; border: 1px solid #334155; border-radius: .5rem;
  padding: 2rem; width: 22rem; box-shadow: 0 .5rem 1.5rem rgba(0,0,0,.3);
}
h1 { margin: 0 0 .3rem; font-size: 1.3rem; }
.sub { color: #94a3b8; font-size: .85rem; margin-bottom: 1.2rem; }
label { display: block; font-size: .85rem; color: #cbd5e1; margin-bottom: .3rem; }
input[type=text], input[type=email] {
  width: 100%; padding: .55rem .7rem; border-radius: .35rem;
  background: #0f172a; color: #e2e8f0; border: 1px solid #475569; font-size: .95rem;
}
input:focus { outline: none; border-color: #60a5fa; }
button {
  margin-top: 1rem; width: 100%; padding: .6rem; border: 0; border-radius: .35rem;
  background: #2563eb; color: #fff; font-size: .95rem; cursor: pointer;
}
button:hover { background: #1d4ed8; }
button:disabled { background: #475569; cursor: not-allowed; }
.banner {
  margin-top: .8rem; padding: .5rem .7rem; background: #14532d; color: #bbf7d0;
  border-radius: .35rem; font-size: .85rem; line-height: 1.5;
}
.warn {
  margin-top: .8rem; padding: .5rem .7rem; background: #7f1d1d; color: #fecaca;
  border-radius: .35rem; font-size: .85rem;
}
.note {
  margin-top: 1.2rem; font-size: .75rem; color: #64748b; line-height: 1.5;
}
a { color: #60a5fa; text-decoration: none; }
</style>
</head>
<body>
<form class="card" method="POST" action="{{.BasePath}}/admin/forgot-password">
  <h1>{{ t .Lang "forgot.title" }}</h1>
  <div class="sub">{{ t .Lang "forgot.subtitle" }}</div>

  {{ if not .MailEnabled }}
  <div class="warn">{{ safeHTML (t .Lang "forgot.mail_disabled") }}</div>
  {{ else }}
    {{ if .Sent }}
    <div class="banner">{{ safeHTML (t .Lang "forgot.sent") }}</div>
    {{ end }}

    <label for="identifier">{{ t .Lang "forgot.identifier_label" }}</label>
    <input id="identifier" name="identifier" type="text" autofocus autocomplete="email" required placeholder="user@example.com / admin">

    <button type="submit">{{ t .Lang "forgot.submit" }}</button>
  {{ end }}

  <div class="note">
    <a href="{{.BasePath}}/admin/login">← {{ t .Lang "forgot.back_to_login" }}</a>
  </div>
</form>
</body>
</html>

# CI: lint + test + admin binary build (multi-arch) + nginx module build (matrix)
#
# release: pushing a tag triggers nfpm to build rpm/deb/apk and attach them to
# the release (= release.yml is a separate file).
name: ci

on:
  push:
    branches: [master, main, multi-site]
  pull_request:
    branches: [master, main, multi-site]
  # Manual trigger, for the same reason codeql has one: a push made while
  # Actions is down never gets a run, and GitHub does not replay the event
  # afterwards -- so the commit stays unverified while the branch looks green,
  # with no way to ask for the checks.  Seen on 2026-08-26 (Actions major
  # outage; 4812b11 and 947d0d6 were pushed into it).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------
  # Go lint / vet / test
  # --------------------------------------------------------------------
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.10"
          cache-dependency-path: admin/go.sum
      # Figures measured on our own nodes have leaked into public text four
      # times; each cleanup was scoped to the release being cut, so older
      # entries survived every sweep.  This runs over everything, every push.
      - name: public text carries no production measurements
        run: |
          ./tools/check-public-text.sh --self-test
          ./tools/check-public-text.sh
      - name: gofmt
        working-directory: admin
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::gofmt issues:"
            echo "$out"
            exit 1
          fi
      - name: go vet
        working-directory: admin
        run: go vet ./...
      - name: go test
        working-directory: admin
        run: go test -race -coverprofile=coverage.out ./...
      - name: coverage report
        working-directory: admin
        run: go tool cover -func=coverage.out | tail -5

  # --------------------------------------------------------------------
  # C parser unit test + fuzz.  The JA4 ClientHello parser (raw TLS bytes on
  # every request) and the _bv pass-cookie parser (a fully client-set cookie)
  # are the two untrusted-input C parsers in the tree -- the most
  # security-sensitive C.  Both get the unit test AND an ASan/UBSan fuzz here,
  # closing the coverage gap the pre-GA audit flagged.
  # --------------------------------------------------------------------
  plugin-parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: test JA4 parser
        run: make test-plugin-parser
      - name: fuzz JA4 + _bv parsers (ASan/UBSan)
        run: make fuzz-plugin FUZZ_ITERS=3000000

  # --------------------------------------------------------------------
  # golangci-lint (= bundle of ~10 linters incl. staticcheck, gosec, revive)
  # --------------------------------------------------------------------
  golangci-lint:
    runs-on: ubuntu-latest
    needs: go-test
    # Hard gate: the v0.1 lint debt is paid down -- dead code removed, the
    # conventional errcheck calls + reviewed taint-analysis gosec rules are
    # excluded with per-rule rationale in admin/.golangci.yml.  go-test /
    # build / e2e are hard gates too.
    continue-on-error: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.10"
          cache-dependency-path: admin/go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          working-directory: admin
          args: --timeout=5m

  # --------------------------------------------------------------------
  # admin binary (= cross compile linux/{amd64,arm64})
  # --------------------------------------------------------------------
  build-admin:
    runs-on: ubuntu-latest
    needs: go-test
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.10"
          cache-dependency-path: admin/go.sum
      - name: build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          cd admin && CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w -X main.Version=${GITHUB_REF_NAME}" \
                     -o ../dist/unmask-linux-${GOARCH} ./cmd/unmask
          file ../dist/unmask-linux-${GOARCH}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unmask-linux-${{ matrix.goarch }}
          path: dist/unmask-linux-${{ matrix.goarch }}
          retention-days: 14

  # --------------------------------------------------------------------
  # ja4 module (matrix: nginx version x arch).  arm64 could be done with
  # qemu-user, but the module has to be built natively from source, so using a
  # native runner is more reliable.  GitHub Actions' linux/arm64 runner
  # ubuntu-22.04-arm (= GA in late 2024) is available.
  # --------------------------------------------------------------------
  build-module:
    needs: go-test
    strategy:
      fail-fast: false
      matrix:
        nginx: ["1.24.0", "1.26.2", "1.28.0"]
        runner: [ubuntu-latest]
        include:
          - nginx: "1.26.2"
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libpcre2-dev zlib1g-dev
      - name: download nginx source
        run: |
          curl -sSL "https://nginx.org/download/nginx-${{ matrix.nginx }}.tar.gz" -o nginx.tgz
          tar -xzf nginx.tgz
      - name: build module
        run: |
          cd nginx-${{ matrix.nginx }}
          ./configure --with-compat --with-http_ssl_module \
                      --add-dynamic-module=$GITHUB_WORKSPACE/nginx-module
          make modules
          ls -la objs/ngx_http_unmask_module.so
      - name: rename + arch suffix
        id: arch
        run: |
          arch=$(uname -m)
          case "$arch" in
            x86_64)  goarch=amd64 ;;
            aarch64) goarch=arm64 ;;
            *)       goarch=$arch ;;
          esac
          mkdir -p dist
          cp nginx-${{ matrix.nginx }}/objs/ngx_http_unmask_module.so \
             dist/ngx_http_unmask_module-nginx${{ matrix.nginx }}-linux-${goarch}.so
          echo "goarch=${goarch}" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ngx-ja4-nginx${{ matrix.nginx }}-${{ steps.arch.outputs.goarch }}
          path: dist/*.so
          retention-days: 14

  # --------------------------------------------------------------------
  # e2e: spin up nginx + admin via docker-compose and run 4 scenarios
  # --------------------------------------------------------------------
  # Both container images must at least build: the nginx one compiles the
  # module against the pinned official nginx version, so an nginx bump or a
  # module change that breaks under --with-compat shows up here, not on the
  # release tag.  amd64 only; the release workflow does the multi-arch push.
  docker-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: build admin image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: unmask-ci/admin:test
      - name: build nginx image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/nginx/Dockerfile
          push: false
          load: true
          tags: unmask-ci/nginx:test
      - name: module loads in the official image
        run: |
          docker run --rm unmask-ci/nginx:test nginx -t
          docker run --rm unmask-ci/nginx:test nginx -V 2>&1 | grep -q -- '--with-compat'
      # unmask.sh serves the images as static files (docker/registry/).  Lay
      # the admin image out the way tools/build-registry.sh does at release
      # time, serve the tree with stock nginx and the include, and pull it
      # with docker: the media types, headers and file names the client
      # expects are all in that include, and nothing else exercises them.
      - name: static registry layout pulls with docker
        run: |
          docker buildx build --output type=oci,dest=/tmp/admin.oci.tar --build-arg UNMASK_VERSION=ci .
          mkdir -p /tmp/admin-layout && tar -xf /tmp/admin.oci.tar -C /tmp/admin-layout
          python3 tools/oci-static-registry.py --layout /tmp/admin-layout --name admin --tag ci --tag latest --out /tmp/registry
          docker run -d --name oci-static -p 127.0.0.1:5999:80 \
            -v /tmp/registry/v2:/var/www/unmask.sh/v2:ro \
            -v $PWD/docker/registry/oci-static.inc:/etc/nginx/unmask-registry/oci-static.inc:ro \
            -v $PWD/docker/registry/oci-static-map.conf:/etc/nginx/conf.d/zz-oci-static-map.conf:ro \
            -v $PWD/docker/registry/nginx-test.conf:/etc/nginx/conf.d/default.conf:ro \
            nginx:1.28
          sleep 2
          docker exec oci-static nginx -t
          curl -sI http://127.0.0.1:5999/v2/ | grep -q 'Docker-Distribution-API-Version: registry/2.0'
          docker pull 127.0.0.1:5999/admin:ci
          docker run --rm 127.0.0.1:5999/admin:ci version
          # by digest, and the moving tag
          dgst=$(sha256sum /tmp/registry/v2/admin/manifests/ci.man | cut -d' ' -f1)
          docker pull 127.0.0.1:5999/admin@sha256:$dgst
          docker pull 127.0.0.1:5999/admin:latest
          docker rm -f oci-static
      # The compose example, end to end, on the images just built: first boot
      # of the admin container (skeleton config, migrate, render), the nginx
      # sidecar picking up the rendered includes, and the gateway answering --
      # the redirect on :80, the challenge for a curl fingerprint on /, and
      # the daemon reached through the gateway on /unmask/healthz.  Nothing
      # else in CI executes the gateway template; e2e-docker carries its own
      # nginx.conf.
      - name: compose example boots and the gateway answers
        run: |
          docker tag unmask-ci/admin:test unmask.sh/admin:latest
          docker tag unmask-ci/nginx:test unmask.sh/nginx:1.28
          # No certificate prepared: the first start serves a self-signed one
          # the admin generated (Settings > Gateway > self-signed).
          docker compose -f docker-compose.example.yml -f e2e/docker/admin-port-override.yml up -d --no-build
          for i in $(seq 1 40); do
            [ "$(docker inspect -f '{{.State.Status}}' unmask-nginx 2>/dev/null)" = running ] && break
            sleep 3
          done
          sleep 5
          docker compose -f docker-compose.example.yml ps
          test "$(docker inspect -f '{{.RestartCount}}' unmask-admin)" = 0
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/)" = 301
          # The example seeds no hostname: :443 answers for any, with the
          # self-signed pair the admin generated (O = unmask gateway).
          curl -sk --resolve localhost:443:127.0.0.1 https://localhost/ | grep -q '<title>Security check</title>'
          test "$(curl -sk --resolve localhost:443:127.0.0.1 -o /dev/null -w '%{http_code}' https://localhost/unmask/healthz)" = 200
          test "$(curl -sk --max-time 5 -o /dev/null -w '%{http_code}' https://127.0.0.1/unmask/healthz)" = 200
          echo | openssl s_client -connect 127.0.0.1:443 -servername localhost 2>/dev/null | openssl x509 -noout -subject | grep -q 'unmask gateway (self-signed)'
          # The upstream is the admin's (seeded from UNMASK_UPSTREAM on the
          # admin service); the nginx side says so.
          docker logs unmask-nginx 2>&1 | grep -q -- '-> http://app:80 (settings > Gateway)'
          docker exec unmask-admin grep -q 'proxy_pass http://app:80;' /etc/unmask/gateway-location.inc
          docker exec unmask-nginx nginx -t
          # The reload watcher is up, and acts: touching the rendered includes
          # through the admin (a re-render with a changed setting) must make
          # nginx reload on its own.
          docker logs unmask-nginx 2>&1 | grep -q 'unmask-autoreload: watching'
          docker exec unmask-admin sh -c 'sed -i "s|^nginx:$|nginx:\n    bypass_ips:\n        - 203.0.113.9|" /etc/unmask/admin.yml'
          docker exec unmask-admin /usr/local/bin/unmask render-nginx -config /etc/unmask/admin.yml
          for i in $(seq 1 20); do
            docker logs unmask-nginx 2>&1 | grep -q 'nginx reloaded' && break
            sleep 1
          done
          docker logs unmask-nginx 2>&1 | grep -q 'unmask-autoreload: includes changed, nginx reloaded'
          # :80 behind a load balancer: a health-check user agent is exempt
          # from the https redirect and, on a bypass path, reaches the
          # upstream; forwarded https traffic (X-Forwarded-Proto) is served
          # on :80 like :443 -- it gets the challenge, not a redirect; plain
          # http still redirects.
          docker exec unmask-admin sh -c 'sed -i "s|^nginx:$|nginx:\n    bypass_paths:\n        paths:\n            - path: \"^/lb-probe/\"|" /etc/unmask/admin.yml'
          docker exec unmask-admin /usr/local/bin/unmask render-nginx -config /etc/unmask/admin.yml
          for i in $(seq 1 20); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' -A 'GoogleHC/1.0' http://127.0.0.1/lb-probe/x)" = 200 ] && break
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' -A 'GoogleHC/1.0' http://127.0.0.1/lb-probe/x)" = 200
          curl -s -H 'X-Forwarded-Proto: https' http://127.0.0.1/ | grep -q '<title>Security check</title>'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/still-redirected)" = 301
      # The admin UI on the container: the setup wizard completes with the
      # token the entrypoint minted, and settings > Gateway takes a pasted
      # certificate that :443 then serves (stored pair, key 0600, reload).
      - name: wizard completes and a pasted certificate lands on the gateway
        run: |
          ADMIN_URL=http://127.0.0.1:19477/unmask GATEWAY=127.0.0.1:443 \
            e2e/docker/gateway-ui-smoke.sh
      # Automatic HTTPS: the same stack with UNMASK_ACME_EMAIL set, issuing
      # from Pebble (Let's Encrypt's test server, validation off).  The
      # certificate nginx serves must be Pebble's, and it must survive a
      # restart from the state volume rather than be issued again.
      - name: gateway obtains its certificate over ACME
        run: |
          docker compose -f docker-compose.example.yml down -v
          docker compose -f docker-compose.example.yml -f e2e/docker/acme-override.yml up -d --no-build
          for i in $(seq 1 40); do
            [ "$(docker inspect -f '{{.State.Status}}' unmask-nginx 2>/dev/null)" = running ] && break
            sleep 3
          done
          # The step runs under bash -e, and `x=$(cmd)` fails the step when cmd
          # does -- which it does until the certificate exists.  Hence `|| true`.
          cert() { echo | timeout 5 openssl s_client -connect 127.0.0.1:443 -servername example.test 2>/dev/null | openssl x509 -noout "$1" 2>/dev/null || true; }
          for i in $(seq 1 30); do
            iss=$(cert -issuer)
            echo "$iss" | grep -q 'Pebble' && break
            sleep 3
          done
          echo "served: $iss"; echo "$iss" | grep -q 'Pebble'
          s1=$(cert -serial)
          docker restart unmask-nginx && sleep 8
          s2=$(cert -serial)
          echo "before=$s1 after=$s2"; test -n "$s1" && test "$s1" = "$s2"
      # TLS terminated in front: no :443, and :80 serves forwarded https
      # traffic (X-Forwarded-Proto from a trusted range) like :443 would.
      - name: gateway serves :80 only when TLS ends at a load balancer
        run: |
          docker compose -f docker-compose.example.yml down -v
          docker compose -f docker-compose.example.yml -f e2e/docker/admin-port-override.yml -f e2e/docker/tls-none-override.yml up -d --no-build
          for i in $(seq 1 40); do
            [ "$(docker inspect -f '{{.State.Status}}' unmask-nginx 2>/dev/null)" = running ] && break
            sleep 3
          done
          sleep 5
          docker logs unmask-nginx 2>&1 | grep -q 'tls: none'
          test "$(docker inspect -f '{{.RestartCount}}' unmask-nginx)" = 0
          curl -s -H 'X-Forwarded-Proto: https' http://127.0.0.1/ | grep -q '<title>Security check</title>'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/)" = 301
          ! curl -sk --max-time 5 -o /dev/null https://127.0.0.1/
      - name: compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.example.yml logs --no-color | tail -80

  e2e-docker:
    runs-on: ubuntu-latest
    needs: [go-test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: docker compose up + run e2e
        run: make e2e-docker
      - name: dump compose logs on failure
        if: failure()
        run: |
          docker compose -f e2e/docker/docker-compose.yml logs --no-color || true

  # --------------------------------------------------------------------
  # ui-e2e: browser-level admin UI checks.  Boots a throwaway admin (no
  # nginx, no docker) and drives Chrome with puppeteer against the pages
  # whose behaviour lives in client JS and CSS -- the layer the Go tests
  # cannot see and where three real regressions have already hidden.
  # --------------------------------------------------------------------
  ui-e2e:
    runs-on: ubuntu-latest
    needs: [go-test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.10"
          cache-dependency-path: admin/go.sum
      - name: npm ci
        run: cd e2e/ui && npm ci
      - name: run browser checks
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: make e2e-ui

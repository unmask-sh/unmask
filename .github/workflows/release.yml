# release: on a v* tag push, build the admin binary on GH Actions and create a
# draft release.  The rpm/deb/apk and signed checksums must be built locally
# (= Makefile: package-all / sign-rpm — needs Docker for multi-OpenSSL plugin)
# and uploaded with `gh release upload` before flipping the draft to published.
#
# Local release procedure (= after the tag is pushed):
#
#   make package-all       # admin + plugin-nginx-fat + web-{nginx,apache,caddy}
#   make sign-rpm
#   (cd dist && sha256sum *.rpm *.deb *.apk *-linux-* > checksums.txt \
#                && gpg --detach-sign --armor -o checksums.txt.sig checksums.txt)
#   gh release upload v0.X.Y dist/*.{rpm,deb,apk} dist/checksums.txt dist/checksums.txt.sig
#   gh release edit v0.X.Y --draft=false
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-admin:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: admin/go.sum
      - name: build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          cd admin
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -X main.Version=${GITHUB_REF_NAME#v}" \
            -o "../dist/unmask-admin-linux-${GOARCH}" ./cmd/unmask-admin
      - uses: actions/upload-artifact@v4
        with:
          name: admin-${{ matrix.goarch }}
          path: dist/

  release:
    needs: build-admin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: flatten + checksums for admin binaries
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ( cd dist && sha256sum unmask-admin-linux-* > checksums.txt )
          ls -la dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: true
          body: |
            ## Distribution

            Primary install path: **https://unmask.sh/install/** (= rpm / deb / apk
            repository with auto-update via dnf / apt / apk).

            This Release page is an alternative for direct download / air-gapped
            install / reference.

            ## Artifacts

            - `unmask-X.Y.Z.{rpm,deb,apk}` — main package (= admin binary + systemd unit + config skeleton)
            - `unmask-plugin-nginx-fat-X.Y.Z.{rpm,deb,apk}` — nginx dynamic module bundle (14 nginx versions × OpenSSL 1.0 / 1.1+ / 3.x)
            - `unmask-web-{nginx,apache,caddy}-X.Y.Z.{rpm,deb,apk}` — per-web-server config snippets (= auth_request mode)
            - `unmask-admin-linux-{amd64,arm64}` — raw Go binary (= no system integration)
            - `checksums.txt` — SHA-256 hashes for all artifacts above
            - `checksums.txt.sig` — GPG detached signature (= verify with the unmask GPG public key)

            ## Verify

            ```sh
            curl -O https://github.com/unmask-sh/unmask/releases/download/vX.Y.Z/checksums.txt{,.sig}
            gpg --verify checksums.txt.sig checksums.txt
            sha256sum --check checksums.txt
            ```

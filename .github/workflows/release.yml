# release: on a v* tag push, build the admin binary on GH Actions and create a
# draft release.  The rpm/deb/apk and signed checksums must be built locally
# (= Makefile: package-all / sign-rpm — needs Docker for multi-OpenSSL plugin)
# and uploaded with `gh release upload` before flipping the draft to published.
#
# Local release procedure (= after the tag is pushed):
#
#   make package-all       # admin + plugin-nginx-fat + web-{nginx,apache}
#   make sign-rpm
#   (cd dist && sha256sum *.rpm *.deb *.apk *-linux-* > checksums.txt \
#                && gpg --detach-sign --armor -o checksums.txt.sig checksums.txt)
#   gh release upload v0.X.Y dist/*.{rpm,deb,apk} dist/checksums.txt dist/checksums.txt.sig
#   gh release edit v0.X.Y --draft=false
name: release

on:
  push:
    tags: ["v*"]

# Least-privilege default: only the `release` job needs to write (create the
# GitHub release); build/docker/sbom only read the checkout + push to the
# DockerHub registry / artifact store, neither of which needs contents:write.
permissions:
  contents: read

jobs:
  build-admin:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.25.10"
          cache-dependency-path: admin/go.sum
      - name: build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          cd admin
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -X main.Version=${GITHUB_REF_NAME#v}" \
            -o "../dist/unmask-linux-${GOARCH}" ./cmd/unmask
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: admin-${{ matrix.goarch }}
          path: dist/

  docker:
    runs-on: ubuntu-latest
    # Skipped unless the DOCKERHUB_TOKEN secret is configured (= keeps the
    # release path green for branch-protection rules even before the docker
    # account is hooked up).
    if: ${{ vars.DOCKERHUB_PUSH_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: extract version
        id: ver
        run: echo "v=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            UNMASK_VERSION=${{ steps.ver.outputs.v }}
          tags: |
            unmask/admin:${{ steps.ver.outputs.v }}
            unmask/admin:latest

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.25.10"
          cache-dependency-path: admin/go.sum
      - name: install cyclonedx-gomod
        run: go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0
      - name: generate CycloneDX SBOM (json + xml)
        working-directory: admin
        run: |
          mkdir -p ../dist
          $(go env GOPATH)/bin/cyclonedx-gomod mod -licenses -json -output ../dist/unmask-${GITHUB_REF_NAME#v}.cdx.json
          $(go env GOPATH)/bin/cyclonedx-gomod mod -licenses        -output ../dist/unmask-${GITHUB_REF_NAME#v}.cdx.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: dist/unmask-*.cdx.*

  release:
    needs: [build-admin, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release + upload assets
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: flatten + checksums for admin binaries + SBOM
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ( cd dist && sha256sum unmask-linux-* unmask-*.cdx.* > checksums.txt )
          ls -la dist/
      - uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: dist/*
          generate_release_notes: true
          draft: true
          body: |
            ## Distribution

            Primary install path: **https://unmask.sh/install/** (= rpm / deb / apk
            repository with auto-update via dnf / apt / apk).

            This Release page is an alternative for direct download / air-gapped
            install / reference.

            ## Artifacts

            - `unmask-X.Y.Z.{rpm,deb,apk}` — main package (= admin binary + systemd unit + config skeleton)
            - `unmask-plugin-nginx-fat-X.Y.Z.{rpm,deb,apk}` — nginx dynamic module bundle (14 nginx versions × OpenSSL 1.0 / 1.1+ / 3.x)
            - `unmask-web-{nginx,apache}-X.Y.Z.{rpm,deb,apk}` — per-web-server config snippets (= forward-auth mode)
            - `unmask-linux-{amd64,arm64}` — raw Go binary (= no system integration)
            - `checksums.txt` — SHA-256 hashes for all artifacts above
            - `checksums.txt.sig` — GPG detached signature (= verify with the unmask GPG public key)

            ## Verify

            ```sh
            curl -O https://github.com/unmask-sh/unmask/releases/download/vX.Y.Z/checksums.txt{,.sig}
            gpg --verify checksums.txt.sig checksums.txt
            sha256sum --check checksums.txt
            ```

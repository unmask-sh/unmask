# release: on a v* tag push, build the admin binary on GH Actions and create a
# draft release.  The rpm/deb/apk and signed checksums must be built locally
# (= Makefile: package-all / sign-rpm — needs Docker for multi-OpenSSL plugin)
# and uploaded with `gh release upload` before flipping the draft to published.
#
# Local release procedure (= after the tag is pushed):
#
#   make package-all       # admin + plugin-nginx-fat + web-{nginx,apache}
#   make sign-rpm
#   (cd dist && sha256sum *.rpm *.deb *.apk *-linux-* > checksums.txt \
#                && gpg --detach-sign --armor -o checksums.txt.sig checksums.txt)
#   gh release upload v0.X.Y dist/*.{rpm,deb,apk} dist/checksums.txt dist/checksums.txt.sig
#   gh release edit v0.X.Y --draft=false
name: release

on:
  push:
    tags: ["v*"]

# Least-privilege default: only the `release` job needs to write (create the
# GitHub release); build/docker/sbom only read the checkout + push to the
# DockerHub registry / artifact store, neither of which needs contents:write.
permissions:
  contents: read

jobs:
  build-admin:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The embedded bypass-IP snapshot ships inside this binary, and installs
      # that cannot sync (locked-down trust stores) run on it alone.  It went
      # stale silently for six weeks once -- 642 vendor prefixes missing,
      # genuine crawlers 403'd -- because refreshing it is a human step
      # (`make update-iprange-embed`, run + commit before release).  This gate
      # turns the forgotten step into a failed release instead of a shipped
      # regression.  7 days: the hub feed regenerates daily, so a snapshot
      # older than that means the step was skipped, not that vendors idled.
      - name: embedded iprange snapshot freshness
        run: |
          meta=admin/assets/iprange/snapshot-meta.json
          test -f "$meta" || { echo "::error::$meta missing — run 'make update-iprange-embed' and commit before tagging"; exit 1; }
          gen=$(python3 -c "import json;print(json.load(open('$meta'))['generatedAt'])")
          age_days=$(python3 -c "
          import json,datetime
          g=datetime.datetime.fromisoformat(json.load(open('$meta'))['generatedAt'].replace('Z','+00:00'))
          print((datetime.datetime.now(datetime.timezone.utc)-g).days)")
          echo "snapshot generatedAt=$gen (${age_days}d old)"
          if [ "$age_days" -gt 7 ]; then
            echo "::error::embedded iprange snapshot is ${age_days} days old (ceiling 7) — run 'make update-iprange-embed', commit admin/assets/iprange, then re-tag"
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.10"
          cache-dependency-path: admin/go.sum
      - name: build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          cd admin
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -X main.Version=${GITHUB_REF_NAME#v}" \
            -o "../dist/unmask-linux-${GOARCH}" ./cmd/unmask
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: admin-${{ matrix.goarch }}
          path: dist/

  docker:
    runs-on: ubuntu-latest
    # Skipped unless the DOCKERHUB_TOKEN secret is configured (= keeps the
    # release path green for branch-protection rules even before the docker
    # account is hooked up).
    if: ${{ vars.DOCKERHUB_PUSH_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: extract version
        id: ver
        run: echo "v=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            UNMASK_VERSION=${{ steps.ver.outputs.v }}
          tags: |
            unmask/admin:${{ steps.ver.outputs.v }}
            unmask/admin:latest

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.10"
          cache-dependency-path: admin/go.sum
      - name: install cyclonedx-gomod
        run: go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0
      - name: generate CycloneDX SBOM (json + xml)
        working-directory: admin
        run: |
          mkdir -p ../dist
          $(go env GOPATH)/bin/cyclonedx-gomod mod -licenses -json -output ../dist/unmask-${GITHUB_REF_NAME#v}.cdx.json
          $(go env GOPATH)/bin/cyclonedx-gomod mod -licenses        -output ../dist/unmask-${GITHUB_REF_NAME#v}.cdx.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: dist/unmask-*.cdx.*

  release:
    needs: [build-admin, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release + upload assets
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: flatten + checksums for admin binaries + SBOM
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ( cd dist && sha256sum unmask-linux-* unmask-*.cdx.* > checksums.txt )
          ls -la dist/
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/*
          generate_release_notes: true
          draft: true
          body: |
            ## Distribution

            Primary install path: **https://unmask.sh/install/** (= rpm / deb / apk
            repository with auto-update via dnf / apt / apk).

            This Release page is an alternative for direct download / air-gapped
            install / reference.

            ## Artifacts

            - `unmask-X.Y.Z.{rpm,deb,apk}` — main package (= admin binary + systemd unit + config skeleton)
            - `unmask-plugin-nginx-fat-X.Y.Z.{rpm,deb,apk}` — nginx dynamic module bundle (14 nginx versions × OpenSSL 1.0 / 1.1+ / 3.x)
            - `unmask-web-{nginx,apache}-X.Y.Z.{rpm,deb,apk}` — per-web-server config snippets (= forward-auth mode)
            - `unmask-linux-{amd64,arm64}` — raw Go binary (= no system integration)
            - `checksums.txt` — SHA-256 hashes for all artifacts above
            - `checksums.txt.sig` — GPG detached signature (= verify with the unmask GPG public key)

            ## Verify

            ```sh
            curl -O https://github.com/unmask-sh/unmask/releases/download/vX.Y.Z/checksums.txt{,.sig}
            gpg --verify checksums.txt.sig checksums.txt
            sha256sum --check checksums.txt
            ```

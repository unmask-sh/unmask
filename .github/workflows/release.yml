# release: on a release tag push, build the unmask binary on GH Actions
# (reproducibly: the Makefile recipe, built twice), generate the SBOM and
# create a draft release carrying both.  The rpm/deb/apk and the signed
# checksums must be built locally (= Makefile: package-all / sign-rpm --
# needs Docker for the multi-OpenSSL plugin) and uploaded with `gh release
# upload` before flipping the draft to published.  release-verify.yml then
# reads the published page and fails on a missing or unsigned piece.
#
# What this workflow builds -- the binaries, the SBOM, the image -- carries a
# build-provenance attestation (actions/attest-build-provenance: a signed
# SLSA statement, stored with the repository, naming this workflow, the
# commit and the run).  A downloader checks a file on the release page with
# `gh attestation verify unmask-linux-amd64 --repo unmask-sh/unmask`, and
# the image with `gh attestation verify oci://ghcr.io/unmask-sh/unmask:<v>
# --repo unmask-sh/unmask`.  The packages are built and signed locally (the
# procedure below), so they are not attested: their provenance is the GPG
# signature on each rpm and on checksums.txt, which release-verify.yml
# checks on the published page, together with the attestation of the
# binaries.
#
# Local release procedure (= after the tag is pushed and this workflow is green):
#
#   make package-all       # admin + plugin-nginx-fat + web-{nginx,apache}
#   gh release download v0.X.Y --pattern 'unmask-linux-*' --dir ci-bin
#   (cd ci-bin && sha256sum unmask-linux-*) | sed 's| ci-bin/| dist/|' | sha256sum -c
#                          # the local build and the workflow's are the same
#                          # recipe from the same commit, so the bytes match;
#                          # when they do not, stop -- the tree or the
#                          # toolchain is not the tag's.  The binaries on the
#                          # page stay the workflow's: do not upload dist's.
#   make sign-rpm          # do NOT skip: 0.1.36-38 shipped UNSIGNED rpms to the
#                          # release page because this step was missed (the /dl/
#                          # repo copies are signed separately by build-repo.sh,
#                          # which hid the gap).  checksums.txt must be generated
#                          # AFTER signing so it hashes the signed rpms.
#   gh release download v0.X.Y --pattern 'unmask-*.cdx.*' --dir dist
#                          # the SBOM is in the list too: 0.1.53's hand-made
#                          # checksums.txt replaced the draft's and lost it.
#   (cd dist && sha256sum unmask-linux-* unmask-*.cdx.* *.rpm *.deb *.apk > checksums.txt \
#                && gpg --detach-sign -o checksums.txt.sig checksums.txt)
#   gh release upload v0.X.Y dist/*.{rpm,deb,apk} dist/checksums.txt dist/checksums.txt.sig --clobber
#   gh release edit v0.X.Y --draft=false
#                          # release-verify runs on this; read its verdict.
#                          # Its last job points ghcr.io/unmask-sh/unmask:latest
#                          # at this version: until then :latest is the
#                          # previous release.
name: release

on:
  push:
    # A release tag only.  A pre-release tag (v0.1.54-rc3, the testing
    # channel) must not open a draft release or push the release image.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

# Least-privilege default: only the `release` job needs contents:write (create
# the GitHub release) and only the `docker` job needs packages:write (GHCR);
# the two jobs that attest what they publish add id-token:write (the OIDC
# token Sigstore signs against) and attestations:write (storing the
# statement); everything else reads the checkout.
permissions:
  contents: read

# One run per tag, never cancelled by another: a release run that is
# superseded would leave a half-filled draft behind.  Each job has a
# timeout-minutes well under the six-hour default.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The embedded bypass-IP snapshot ships inside this binary, and installs
      # that cannot sync (locked-down trust stores) run on it alone.  It went
      # stale silently for six weeks once -- 642 vendor prefixes missing,
      # genuine crawlers 403'd -- because refreshing it is a human step
      # (`make update-iprange-embed`, run + commit before release).  This gate
      # turns the forgotten step into a failed release instead of a shipped
      # regression.  7 days: the hub feed regenerates daily, so a snapshot
      # older than that means the step was skipped, not that vendors idled.
      - name: embedded iprange snapshot freshness
        run: |
          meta=admin/assets/iprange/snapshot-meta.json
          test -f "$meta" || { echo "::error::$meta missing — run 'make update-iprange-embed' and commit before tagging"; exit 1; }
          gen=$(python3 -c "import json;print(json.load(open('$meta'))['generatedAt'])")
          age_days=$(python3 -c "
          import json,datetime
          g=datetime.datetime.fromisoformat(json.load(open('$meta'))['generatedAt'].replace('Z','+00:00'))
          print((datetime.datetime.now(datetime.timezone.utc)-g).days)")
          echo "snapshot generatedAt=$gen (${age_days}d old)"
          if [ "$age_days" -gt 7 ]; then
            echo "::error::embedded iprange snapshot is ${age_days} days old (ceiling 7) — run 'make update-iprange-embed', commit admin/assets/iprange, then re-tag"
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: admin/go.mod
          cache-dependency-path: admin/go.sum
      # The version stamped into the binary is the Makefile's, so the tag and
      # the Makefile have to agree before anything is built.
      - name: the Makefile's version is the tag's
        run: |
          v=$(sed -n 's/^UNMASK_VERSION ?= //p' Makefile)
          if [ "$v" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::Makefile has UNMASK_VERSION=$v but the tag is ${GITHUB_REF_NAME}; bump the Makefile in the release commit and re-tag"
            exit 1
          fi
      # The same recipe ci.yml builds and checks on every push (`make
      # build-admin`: -trimpath, -buildvcs=false, SOURCE_DATE_EPOCH from the
      # commit).  The target builds twice and fails unless both builds are
      # byte-identical, so the binary on the release page is one a rebuild
      # from the tag can be checked against -- and the local release
      # procedure's `make package-all` produces the same bytes.
      - name: build (the Makefile recipe) and prove it reproduces
        run: make verify-reproducible GOARCH=${{ matrix.goarch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admin-${{ matrix.goarch }}
          path: dist/

  # Container image -> GHCR (ghcr.io/unmask-sh/unmask).  The workflow token is
  # enough: no registry account, no long-lived secret.  One image per
  # release: the gateway -- the official nginx image with the unmask module
  # built against that exact nginx version, plus the daemon (Dockerfile).
  docker:
    runs-on: ubuntu-latest
    # The arm64 half of the image is built under qemu.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - name: unmask
            dockerfile: Dockerfile
            build-args: NGINX_VERSION=1.30.6
            # The version tag only.  :latest is not pushed here: a tag push
            # comes before the release gate, and a release that stops at this
            # point (0.1.54) or waits as a draft must not be what :latest
            # serves.  release-verify.yml points :latest at this image once
            # the release is published and its page has verified.
            tags: |
              ghcr.io/unmask-sh/unmask:VERSION
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      # provenance-add-gha=false: the image keeps its provenance attestation
      # (builder, source revision, build parameters), without the workflow
      # event payload buildx adds by default.  That payload carries account
      # details of whoever pushed the tag, and the attestation is published
      # with the image.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: provenance-add-gha=false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: resolve tags
        id: meta
        env:
          TAGS: ${{ matrix.tags }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          {
            echo "tags<<EOF"
            printf '%s\n' "$TAGS" | sed "s/VERSION/${v}/g"
            echo "EOF"
            echo "version=$v"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            UNMASK_VERSION=${{ steps.meta.outputs.version }}
            ${{ matrix.build-args }}
          tags: ${{ steps.meta.outputs.tags }}
      # The image's provenance, beside buildx's own: a signed statement that
      # this run, on this commit, built the manifest with this digest, pushed
      # to the registry next to the image and kept with the repository.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/unmask-sh/unmask
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: admin/go.mod
          cache-dependency-path: admin/go.sum
      - name: install cyclonedx-gomod
        run: go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0
      - name: generate CycloneDX SBOM (json + xml)
        working-directory: admin
        run: |
          mkdir -p ../dist
          $(go env GOPATH)/bin/cyclonedx-gomod mod -licenses -json -output ../dist/unmask-${GITHUB_REF_NAME#v}.cdx.json
          $(go env GOPATH)/bin/cyclonedx-gomod mod -licenses        -output ../dist/unmask-${GITHUB_REF_NAME#v}.cdx.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: dist/unmask-*.cdx.*

  release:
    needs: [build-admin, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the GitHub release + upload assets
      id-token: write # the attestation's signing identity
      attestations: write # store the attestation with the repository
    steps:
      # Guard: a tag push for a tag whose release is already PUBLISHED must not
      # touch that release.  action-gh-release (draft: true below) does not
      # create a second draft in that case -- it uploads into the existing
      # release, silently replacing its hand-built assets with CI ones.  That
      # is exactly what happened on 2026-09-03, when re-pushing v0.1.36-38
      # after a history rewrite overwrote the signed checksums + binaries of
      # three published releases.  Draft releases (the normal flow: this job
      # creates the draft, the local release procedure fills and publishes it)
      # are still updated as before.
      - name: skip when the tag already has a published release
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq .draft 2>/dev/null)" = "false" ]; then
            echo "published release exists for ${GITHUB_REF_NAME}; leaving its assets alone"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      # The compose example is attached from the checkout (0.1.37 shipped it
      # by hand: without this step the release job had no working tree).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.guard.outputs.skip != 'true'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.guard.outputs.skip != 'true'
        with:
          path: artifacts
      - name: flatten + checksums for unmask binaries + SBOM
        if: steps.guard.outputs.skip != 'true'
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ( cd dist && sha256sum unmask-linux-* unmask-*.cdx.* > checksums.txt )
          ls -la dist/
      # The binaries' and the SBOM's provenance (the header above).  The
      # subjects are the files as they go onto the release page; the local
      # procedure leaves those in place, so what a downloader verifies is
      # what was attested.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.guard.outputs.skip != 'true'
        with:
          subject-path: |
            dist/unmask-linux-*
            dist/unmask-*.cdx.*
      # The release notes count the plugin's bundled nginx versions from the
      # Makefile, which is where the list lives: a count typed into this
      # file said 14 while the Makefile had 15.
      - name: the plugin's nginx versions, from the Makefile
        id: plugin
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -- $(sed -n 's/^PLUGIN_NGINX_VERSIONS ?= //p' Makefile)
          [ "$#" -gt 0 ] || { echo "::error::PLUGIN_NGINX_VERSIONS not found in the Makefile"; exit 1; }
          echo "count=$#" >> "$GITHUB_OUTPUT"
          echo "first=$1" >> "$GITHUB_OUTPUT"
          eval "echo last=\${$#}" >> "$GITHUB_OUTPUT"
      # The version the body below names: the tag without its v, as the docker
      # job computes it for the image.  The body took it from that job's step,
      # which this job cannot see, so the image reference in the draft ended in
      # a bare colon; and the SBOM's file name was written out as X.Y.Z.
      - name: the version, from the tag
        id: meta
        if: steps.guard.outputs.skip != 'true'
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        if: steps.guard.outputs.skip != 'true'
        with:
          # The compose example rides along so the install page can point at
          # a release-pinned copy (releases/latest/download/...).
          files: |
            dist/*
            docker-compose.example.yml
          generate_release_notes: true
          draft: true
          # This text is the published page: the local release procedure puts
          # the release's paragraph above it and publishes the draft as it is.
          body: |
            ## Distribution

            Primary install paths: **https://unmask.sh/install/** (= rpm / deb / apk
            repositories with auto-update via dnf / apt / apk), or the container
            image `unmask.sh/unmask` (mirrored at `ghcr.io/unmask-sh/unmask`).

            This Release page is an alternative for direct download / air-gapped
            install / reference.

            ## Artifacts

            - `unmask` (rpm / deb / apk) — the daemon: binary + service unit + config skeleton
            - `unmask-plugin-nginx` (rpm / deb / apk) — the nginx dynamic module bundle (${{ steps.plugin.outputs.count }} nginx versions, ${{ steps.plugin.outputs.first }} to ${{ steps.plugin.outputs.last }}, each loaded only by exactly that version; OpenSSL 1.0 / 1.1 / 3 builds on x86_64, 1.1 / 3 on arm64)
            - `unmask-web-nginx` / `unmask-web-apache` (rpm / deb / apk) — the web-server snippets (nginx: the upstream and includes for both modes; Apache: forward-auth)
            - `unmask-nginx-external` (rpm / deb / apk) — only for a host whose nginx was built from source (by hand, by a hosting panel): provides `nginx`, so the two packages above install without the distribution's nginx beside it
            - `unmask-release` (rpm / deb / apk) — the repository definition and public keys
            - `unmask-linux-{amd64,arm64}` — raw Go binary (= no system integration)
            - `unmask-${{ steps.meta.outputs.version }}.cdx.{json,xml}` — SBOM (CycloneDX)
            - `docker-compose.example.yml` — the gateway container, one service
            - `checksums.txt` — SHA-256 of the packages and binaries above
            - `checksums.txt.sig` — its detached GPG signature

            ## Verify

            ```sh
            curl -fsSL https://unmask.sh/dl/keys/RPM-GPG-KEY-unmask | gpg --import
            # fingerprint: C03D D45E 28C4 446F DDC4  8EFC 34A3 20B5 44B2 8158
            curl -fL --remote-name-all https://github.com/unmask-sh/unmask/releases/download/${{ github.ref_name }}/checksums.txt{,.sig}
            gpg --verify checksums.txt.sig checksums.txt
            sha256sum --ignore-missing --check checksums.txt
            # the raw binaries, the SBOM and the image were built by the release workflow:
            gh attestation verify unmask-linux-amd64 --repo unmask-sh/unmask
            gh attestation verify oci://ghcr.io/unmask-sh/unmask:${{ steps.meta.outputs.version }} --repo unmask-sh/unmask
            ```

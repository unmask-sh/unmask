# release-verify: when a release is published, read the release page the way
# a downloader does and check what it serves.
#
# The release page is filled by hand after release.yml creates the draft
# (packages, signed rpms, checksums.txt and its signature), and nothing
# looked at the result: 0.1.36-38 went out with unsigned rpms, and 0.1.53's
# checksums.txt lost the SBOM lines the draft had carried.  This runs on the
# publish event -- the moment the page goes live -- and on demand for an
# older tag.  It fails when checksums.txt is unsigned, signed with another
# key, or does not name every asset; when an rpm is not signed with the
# release key; when the daemon inside the main rpm is not the raw binary
# published beside it; or when a deb, an apk, the SBOM or the compose example
# is missing or malformed; and when a raw binary carries no build-provenance
# attestation from release.yml (releases before 0.1.54 have none, so a
# dispatch on one of those tags stops here).
#
# When the page has verified, the last job points ghcr.io/unmask-sh/unmask:latest
# at the release's image (latest-image, below).
name: release-verify

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag to verify (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-verify-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  # The fingerprint the release notes tell downloaders to check.
  RELEASE_KEY_FPR: C03DD45E28C4446FDDC48EFC34A320B544B28158

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: download every asset of ${{ github.event.release.tag_name || inputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets
          ls -la assets
      - name: checksums.txt is signed with the release key and names every asset
        run: |
          gpg --batch --import rpm/release/RPM-GPG-KEY-unmask
          fpr=$(gpg --batch --with-colons --fingerprint | awk -F: '$1 == "fpr" {print $10; exit}')
          if [ "$fpr" != "$RELEASE_KEY_FPR" ]; then
            echo "::error::rpm/release/RPM-GPG-KEY-unmask has fingerprint $fpr, the release notes name $RELEASE_KEY_FPR"
            exit 1
          fi
          cd assets
          sig=checksums.txt.sig
          [ -f "$sig" ] || sig=checksums.txt.asc
          gpg --batch --verify "$sig" checksums.txt
          # Every asset is named (the signature, the list itself and the
          # compose example excepted), and every line checks out.  The
          # hand-made list spells packages as ./name; that is normalised.
          fail=0
          for f in *; do
            case "$f" in checksums.txt|checksums.txt.sig|checksums.txt.asc|docker-compose.example.yml) continue ;; esac
            grep -qE "^[0-9a-f]{64}  (\./)?$f\$" checksums.txt || { echo "::error::$f is on the release page but not in checksums.txt"; fail=1; }
          done
          sed 's|  \./|  |' checksums.txt | sha256sum --check --strict
          test "$fail" = 0
      - name: every rpm is signed with the release key, and the main rpm carries the published binary
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y rpm cpio
          # Ubuntu's rpm keeps its database under $HOME (/root/.rpmdb for
          # root, ~runner/.rpmdb for the runner), so a key imported with sudo
          # is not the one `rpm -Kv` reads, and every signature is NOKEY.  One
          # database, named here and used by both commands, is the same on
          # every distribution.
          db="$PWD/rpmdb"; mkdir -p "$db"
          rpm --dbpath "$db" --import rpm/release/RPM-GPG-KEY-unmask
          for f in assets/*.rpm; do
            # `rpm -Kv` returns 1 for NOKEY or BAD; under bash -e a bare
            # `out=$(...)` would end the step there, before the echo, and the
            # log would show nothing.  The grep below is the verdict.
            out=$(rpm --dbpath "$db" -Kv "$f" || true)
            echo "$out"
            echo "$out" | grep -qiE "Signature, key ID [0-9a-f]*${RELEASE_KEY_FPR: -8}: OK" \
              || { echo "::error::$f is not signed with the release key"; exit 1; }
          done
          # nfpm's payload names the file /usr/sbin/unmask, rpmbuild's would
          # say ./usr/sbin/unmask; the pattern takes either.
          v=${TAG#v}
          for a in x86_64:amd64 aarch64:arm64; do
            rpmarch=${a%%:*}; goarch=${a##*:}
            rpm2cpio "assets/unmask-$v-1.$rpmarch.rpm" | cpio -i --quiet --to-stdout '*usr/sbin/unmask' > "unmask.$goarch"
            test -s "unmask.$goarch" || { echo "::error::no /usr/sbin/unmask in unmask-$v-1.$rpmarch.rpm"; exit 1; }
            cmp "unmask.$goarch" "assets/unmask-linux-$goarch" \
              || { echo "::error::the daemon inside unmask-$v-1.$rpmarch.rpm is not the published unmask-linux-$goarch"; exit 1; }
          done
      - name: the raw binaries and the SBOM carry release.yml's provenance attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${TAG#v}
          for f in assets/unmask-linux-amd64 assets/unmask-linux-arm64 "assets/unmask-$v.cdx.json" "assets/unmask-$v.cdx.xml"; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              || { echo "::error::$f has no build-provenance attestation from release.yml"; exit 1; }
          done
      - name: the debs and apks unpack, the SBOM and the compose example are there
        run: |
          v=${TAG#v}
          for f in assets/*.deb; do dpkg-deb --info "$f" >/dev/null; done
          for f in assets/*.apk; do
            tar -tzf "$f" 2>/dev/null | grep -q '^\.PKGINFO$' || { echo "::error::$f has no .PKGINFO"; exit 1; }
            tar -tzf "$f" 2>/dev/null | grep -q '^\.SIGN\.RSA\.' || { echo "::error::$f is not signed"; exit 1; }
          done
          for f in "assets/unmask-$v.cdx.json" "assets/unmask-$v.cdx.xml" assets/docker-compose.example.yml; do
            test -s "$f" || { echo "::error::$f is missing from the release"; exit 1; }
          done
          echo "release $TAG: $(ls assets | wc -l) assets verified"

  # ghcr.io/unmask-sh/unmask:latest moves here, not in release.yml.  A tag
  # push builds the image and opens a draft; the packages have not met the
  # release gate at that point.  0.1.54 stopped there and was never released,
  # and 0.1.56 waited eleven hours as a draft -- both were what :latest
  # served on the mirror meanwhile.  So release.yml pushes the version tag
  # only, and :latest is pointed at it once the page is published and the job
  # above has passed: the same manifest list, digest for digest, so the
  # image's attestations apply to :latest as they do to the version.  Only
  # for the release GitHub marks as latest -- publishing a fix for an older
  # line, or a dispatch on an older tag, leaves :latest where it is.
  latest-image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      IMAGE: ghcr.io/unmask-sh/unmask
    steps:
      - name: point :latest at the published version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          newest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          if [ "$newest" != "$TAG" ]; then
            echo "$TAG is not the latest release ($newest is): :latest stays where it is"
            exit 0
          fi
          v="${TAG#v}"
          # The digest of a tag is that of the manifest the registry serves
          # for it -- here the list of both architectures.
          digest() { skopeo inspect --raw "docker://$IMAGE:$1" > manifest.json; sha256sum manifest.json | cut -d' ' -f1; }
          printf '%s' "$GH_TOKEN" | skopeo login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          want=$(digest "$v")
          skopeo copy --all --preserve-digests "docker://$IMAGE:$v" "docker://$IMAGE:latest"
          got=$(digest latest)
          if [ "$got" != "$want" ]; then
            echo "::error::$IMAGE:latest is sha256:$got, $IMAGE:$v is sha256:$want"
            exit 1
          fi
          echo "$IMAGE:latest -> $v (sha256:$got)"

# GitHub CodeQL — SAST scan on push to main, PRs into main, and weekly.
# Covers Go (= admin/) and JavaScript (= challenge.js + LP).  C (= the
# nginx module under nginx-module/) is intentionally not in the matrix
# because CodeQL's C analyzer needs `make` to drive the build and the
# module has to be built against pinned nginx source — that flow lives
# in build-module-multi and is overkill for the SAST gate.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 18 * * 1"   # Mondays 18:30 UTC = 03:30 JST

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
          - language: javascript-typescript
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # build-mode: none — CodeQL extracts both Go and JS from source without a
      # build, so no setup-go / explicit build step is needed.  This is the
      # v4-recommended flow and avoids the v3 autobuilder "configuration error"
      # (the admin module lives in admin/, not at the repo root, which tripped
      # the old tracing build).
      - uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          category: "/language:${{ matrix.language }}"

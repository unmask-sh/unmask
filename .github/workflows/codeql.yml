# GitHub CodeQL — SAST scan on push to main, PRs into main, and weekly.
# Covers Go (= admin/) and JavaScript (= challenge.js + LP).  C (= the
# nginx module under nginx-module/) is intentionally not in the matrix
# because CodeQL's C analyzer needs `make` to drive the build and the
# module has to be built against pinned nginx source — that flow lives
# in build-module-multi and is overkill for the SAST gate.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 18 * * 1"   # Mondays 18:30 UTC = 03:30 JST
  # Manual trigger, because a run that ends in startup_failure cannot be
  # retried ("This workflow run cannot be retried") and nothing else here
  # fires on demand -- so a scan lost to a transient GitHub-side failure
  # stayed lost until somebody happened to push again, with the SAST gate
  # quietly not covering the commit in between.  Seen on 2026-08-26.
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Per-language build modes.  JS extracts from source (none).  Go gets
        # an explicit manual build: the CodeQL CLI rejects `none` for Go
        # ("Go does not support the none build mode" — every run failed and Go
        # was never scanned), and autobuild trips on the module living in
        # admin/ rather than the repo root.
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.language == 'go'
        with:
          go-version: "1.25.10"
          cache-dependency-path: admin/go.sum

      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      # Manual tracing build for Go (= what CodeQL observes).  Mirrors the
      # ci.yml build of the admin module.
      - name: Build Go for CodeQL tracing
        if: matrix.language == 'go'
        run: cd admin && go build ./...

      # Upload needs GitHub code scanning, which on a PRIVATE repo requires an
      # Advanced Security license (enterprise-only) and hard-fails without it.
      # Pre-GA (private) we still run the full analysis -- it catches
      # extraction/config breakage like the Go build-mode bug -- but skip the
      # upload.  The moment the repo flips public, upload activates by itself.
      # Visibility is probed via the API because the `schedule` trigger has no
      # event payload (github.event.repository is empty there).
      - name: Probe repo visibility
        id: vis
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "private=$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" >> "$GITHUB_OUTPUT"

      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: "/language:${{ matrix.language }}"
          upload: ${{ steps.vis.outputs.private == 'true' && 'never' || 'always' }}

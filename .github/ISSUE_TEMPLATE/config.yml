blank_issues_enabled: false
contact_links:
  - name: Security vulnerability
    url: https://github.com/unmask-sh/unmask/security/advisories/new
    about: |
      Do NOT open a public issue for security vulnerabilities.  Report it
      privately here, per SECURITY.md.  We coordinate disclosure with you.
  - name: Discussion
    url: https://github.com/unmask-sh/unmask/discussions
    about: |
      Deployment patterns, ideas and open-ended questions belong in
      Discussions.  A question about something that does not behave as
      you expected can also be an issue: use the "Question / help" form.
  - name: Docs and install steps
    url: https://unmask.sh/docs/
    about: |
      Common questions are answered in the docs and install guide.  Please
      skim before opening an issue.

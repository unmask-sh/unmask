# Dependabot reports which direct dependencies have moved.
# - Go modules under admin/ (= the admin daemon source).
# - GitHub Actions used by ci.yml / release.yml.
#
# Its pull requests are a REPORT.  None of them is merged and none of their
# diffs is applied: each is read and closed.  A dependency moves in a commit of
# our own, when there is a reason to move it.
#
# Why none is merged: Dependabot has no way to set the git author on its
# commits (dependabot-core#6586), and GitHub's contributors list is built from
# commit authors -- so merging even one of them puts a bot beside the humans on
# the repo page, permanently, with no way back short of rewriting published
# history.
#
# One group per ecosystem, monthly, so the report is two pull requests a month
# and not a stream.  Grouping also keeps together what has to move together: an
# action used in several steps (github/codeql-action's init and analyze, pinned
# here to one SHA) used to be reported a step at a time, and a pin moved
# without the other leaves the two on mismatched versions with the analysis
# failing.
#
# Slowing the cadence costs nothing in security terms: Dependabot security
# updates fire on advisory publication, not on this schedule.
#
# A monthly interval runs on the first of the month; the day / time / timezone
# keys apply to daily and weekly schedules only, so they are left off rather
# than kept as decoration that reads like a setting.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /admin
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      go-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
      - go

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - github-actions

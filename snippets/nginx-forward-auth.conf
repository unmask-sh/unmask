# unmask forward-auth mode for nginx (= 1.5.4+).
#
# Purpose: for environments where the unmask nginx dynamic module is not
#          usable (e.g. nginx 1.8 / OpenSSL 1.0.x / shared hosts that won't
#          load modules).
#
# Flow:
#   client -> nginx -> /_unmask/check (= subrequest) -> unmask decides
#                   <- 200 / 401 / 403
#                   -> 200 = pass (= forward as usual)
#                   -> 401 = redirect to challenge
#                   -> 403 = blocked immediately
#
# IMPORTANT — this snippet has TWO parts that live in DIFFERENT nginx scopes.
# You cannot `include` the whole file in one place; split it as below.
#
#   PART 1 (= the `upstream` block) is http{} scope.  Put it in an http-scope
#   conf such as /etc/nginx/conf.d/unmask-upstream.conf.  Most distros include
#   /etc/nginx/conf.d/*.conf inside http{}; on Alpine the http-scope dir is
#   /etc/nginx/http.d/.  Define the upstream exactly ONCE per nginx instance
#   (= not once per server block).
#
#   PART 2 (= the location blocks) is server{} scope.  Save it as an include
#   such as /etc/nginx/snippets/unmask-forward-auth.inc and add it to EACH
#   server{} block you want to protect:
#       include /etc/nginx/snippets/unmask-forward-auth.inc;
#   Then wire auth_request into the location(s) you want guarded (see the
#   "location you want to protect" example inside PART 2).
#
# Feature limitations vs. native nginx-module mode:
#   - The JA4 fingerprint cannot be captured here (= needs TLS handshake
#     info) — unless a JA4-aware layer in front forwards it via the
#     X-Client-JA4 header. See the commented X-Client-JA4 line below.
#   - Everything else (= UA filter / honeypot / persistent BAN / behavioral
#     CAPTCHA / protected paths / two-stage search-bot rescue / rate_limit /
#     log integration) works the same.

# ===========================================================================
# PART 1 — http{} scope.
# Put this in /etc/nginx/conf.d/unmask-upstream.conf (Alpine: /etc/nginx/http.d/).
# Define the upstream exactly ONCE per nginx instance.
# ===========================================================================
# Upstream to unmask.  Keep the port in sync with server.port in
# /etc/unmask/config.yml.
upstream unmask_backend {
    server 127.0.0.1:9477;
    keepalive 16;
}
# --------------------------- END PART 1 (http{}) ---------------------------

# ===========================================================================
# PART 2 — server{} scope.
# include this inside each server{} block you want to protect.
# ===========================================================================

# -------- What to put in the location block you want to protect (example) --------
# location / {
#     auth_request /_unmask/check;
#     auth_request_set $unmask_action $upstream_http_x_unmask_action;
#     error_page 401 = @unmask_challenge;
#     error_page 403 = @unmask_blocked;
#
#     # The existing handling (= proxy_pass / try_files / ...)
#     try_files $uri $uri/ /index.html;
# }

# -------- subrequest endpoint (= internal) --------
location = /_unmask/check {
    internal;
    proxy_pass http://unmask_backend/unmask/api/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    # auth_request is a subrequest, so pass the original request context as headers.
    proxy_set_header X-Original-URI  $request_uri;
    proxy_set_header X-Original-IP   $remote_addr;
    proxy_set_header X-Original-UA   $http_user_agent;
    proxy_set_header X-Original-Host $host;
    # Multi-site (= OPTIONAL).  unmask can scope per site name via the
    # X-Unmask-Site header.  $unmask_site is NOT a built-in nginx variable, so
    # referencing it while undefined aborts `nginx -t` with
    # `unknown "unmask_site" variable`.  To enable: add `set $unmask_site
    # "blog";` (= your site name) in the server{} block, then uncomment below.
    # proxy_set_header X-Unmask-Site   $unmask_site;
    # Client JA4 (forward-auth mode). If a JA4-extracting layer sits in front
    # (= a GCP LB with a custom request header, or a front nginx running a JA4
    # plugin), forward the fingerprint here. unmask honors it ONLY when the real
    # connecting peer (X-Unmask-Conn-Peer, set below from $realip_remote_addr) is
    # a configured trusted LB (admin "trusted LB / CDN" = nginx.trusted_lb_*), so
    # a client reaching this nginx directly cannot spoof a JA4. The source var
    # depends on YOUR layer: a GCP custom header arrives as $http_x_client_ja4; a
    # JA4 plugin exposes its own variable. Match the value below, then uncomment.
    # proxy_set_header X-Client-JA4    $http_x_client_ja4;
    # Real connecting peer for the daemon's LB gate (= the LB when this nginx is
    # behind one). $realip_remote_addr is the pre-realip peer, so it is correct
    # even with set_real_ip_from / real_ip_header configured.
    proxy_set_header X-Unmask-Conn-Peer $realip_remote_addr;
    # Pass cookies through untouched (= unmask needs to see _bv / _br).
    proxy_set_header Cookie          $http_cookie;
    proxy_connect_timeout 1s;
    proxy_read_timeout    2s;
    proxy_send_timeout    1s;
    # Behavior when the admin is down: use error_page to fail-open.
    # For strict operation, drop the error_page line so 502 propagates (= fail-close).
    proxy_intercept_errors on;
    error_page 502 503 504 = @unmask_fail_open;
}

# -------- named location for 401 (= challenge) --------
location @unmask_challenge {
    # The challenge HTML / JS is served directly by unmask.
    rewrite ^ /unmask/challenge/ break;
    proxy_pass http://unmask_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

# -------- named location for 403 (= block: ban / geo / honeypot) --------
# Branded "blocked" page, served by unmask at /unmask/_ban (the same ban deny
# page native mode uses; persistent-block wording, not "retry").  Rate-limit
# overage takes the limit_req -> /unmask/_rl path instead, so this stays the
# persistent-block surface.  If the admin is unreachable the block still holds:
# proxy_intercept_errors falls back to a bare 403 (fail closed).
location @unmask_blocked {
    rewrite ^ /unmask/_ban$request_uri break;
    proxy_pass http://unmask_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Clear admin-internal headers a blocked visitor must not smuggle (the page
    # decision is already made; this only keeps the recorded event honest).
    proxy_set_header X-Banned         "";
    proxy_set_header X-JA4-Verdict    "";
    proxy_set_header X-JA4-Action     "";
    proxy_intercept_errors on;
    error_page 502 503 504 = @unmask_blocked_down;
}
location @unmask_blocked_down {
    return 403 "Access denied by unmask\n";
    add_header Content-Type "text/plain; charset=utf-8";
}

# -------- fail-open when the admin cannot respond --------
# So that the whole site does not 502 when unmask is down, fall through
# to the normal forwarding path.  For strict operation (= bot blocking is
# more important), delete this location and let 502 propagate.
location @unmask_fail_open {
    # Write the normal backend forwarding here.
    # Example: try_files $uri $uri/ /index.html;
    # Example: proxy_pass http://your-app-backend;
    return 200;
}

# -------- block the forward-auth DECISION endpoint from public access --------
# /unmask/api/check is the handler that records bans / counts rate by client IP.
# It is reached ONLY via the internal subrequest above (/_unmask/check, which
# proxy_passes to the backend's /unmask/api/check) -- never directly.  The
# catch-all below forwards request headers (proxy_pass_request_headers on), so
# without this exact-match block a direct client could hit /unmask/api/check with
# a forged X-Original-IP + X-Original-URI and ban / rate-poison another IP (e.g. a
# search engine).  An exact (`=`) match wins over the `^~` catch-all.
location = /unmask/api/check { return 404; }

# -------- proxy_pass the challenge serving + verify API to admin --------
# unmask challenge HTML lives at /unmask/challenge/, verify API at /unmask/api/.
# nginx forwards both straight to admin.
location ^~ /unmask/ {
    proxy_pass http://unmask_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    # Clear every admin-internal header that the visitor must not supply.
    # In native mode the rendered http.inc sets these from $ja4_verdict /
    # $unmask_banned / etc. and the admin trusts them.  In forward-auth mode
    # there is nothing in front to overwrite them, and proxy_pass_request_headers=on
    # would forward whatever the client sent (e.g. X-Banned: 1) -- the auth
    # decision still re-derives them, but the public challenge / debug
    # endpoints record `reason` from these headers, so a visitor could
    # corrupt the Hunt timeline and the dashboard's "why" column.
    proxy_set_header X-Banned         "";
    proxy_set_header X-Honeypot-Hit   "";
    proxy_set_header X-Protected-Mode "";
    proxy_set_header X-JA4-Verdict    "";
    proxy_set_header X-JA4-Action     "";
    # X-Client-JA4 may legitimately arrive from a real JA4-extracting layer in
    # front (e.g. a GCP LB).  The daemon gates it on the connecting peer being a
    # trusted LB (see /_unmask/check above), so a forged value from a non-LB
    # client is dropped server-side; uncommenting the strip below is cheap
    # defense-in-depth for operators with no front JA4 layer at all.
    # proxy_set_header X-Client-JA4 "";
    # Override X-Original-* / X-Unmask-Site so a visitor can't pick another
    # site's per-site config via header smuggling (= same shape as the H-3
    # X-Unmask-Site peer-gate on the admin side).
    proxy_set_header X-Original-Host  $host;
    proxy_set_header X-Unmask-Site    "";
    # challenge.js / verify both set and read cookies, so headers must pass through.
    proxy_pass_request_headers on;
}
# --------------------------- END PART 2 (server{}) -------------------------

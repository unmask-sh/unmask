# unmask forward-auth mode for nginx (= 1.5.4+).
#
# Purpose: for environments where the unmask nginx dynamic module is not
#          usable (e.g. nginx 1.8 / OpenSSL 1.0.x / shared hosts that won't
#          load modules).
#
# Flow:
#   client -> nginx -> /_unmask/check (= subrequest) -> unmask-admin decides
#                   <- 200 / 401 / 403
#                   -> 200 = pass (= forward as usual)
#                   -> 401 = redirect to challenge
#                   -> 403 = blocked immediately
#
# Installation:
#   1. Copy this to /etc/nginx/conf.d/unmask.conf as an include source.
#   2. In each server / location you want to protect, reference it with
#      `include /etc/nginx/conf.d/unmask.inc;` (= keeps it from duplicating
#      across server blocks).
#
# Feature limitations vs. native nginx-module mode:
#   - The JA4 fingerprint cannot be captured here (= needs TLS handshake
#     info) — unless a JA4-aware layer in front forwards it via the
#     X-Client-JA4 header. See the commented X-Client-JA4 line below.
#   - Everything else (= UA filter / honeypot / persistent BAN / behavioral
#     CAPTCHA / protected paths / two-stage search-bot rescue / rate_limit /
#     log integration) works the same.

# Upstream to unmask-admin.  Keep the port in sync with server.port in admin.yml.
upstream unmask_backend {
    server 127.0.0.1:9477;
    keepalive 16;
}

# Centralize the auth_request subrequest in one place and reference it from
# each server (= location-level include).
# The expectation is that this whole file is included inside server {}.

# -------- What to put in the location block you want to protect (example) --------
# location / {
#     auth_request /_unmask/check;
#     auth_request_set $unmask_action $upstream_http_x_unmask_action;
#     error_page 401 = @unmask_challenge;
#     error_page 403 = @unmask_blocked;
#
#     # The existing handling (= proxy_pass / try_files / ...)
#     try_files $uri $uri/ /index.html;
# }

# -------- subrequest endpoint (= internal) --------
location = /_unmask/check {
    internal;
    proxy_pass http://unmask_backend/unmask/api/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    # auth_request is a subrequest, so pass the original request context as headers.
    proxy_set_header X-Original-URI  $request_uri;
    proxy_set_header X-Original-IP   $remote_addr;
    proxy_set_header X-Original-UA   $http_user_agent;
    proxy_set_header X-Original-Host $host;
    # For multi-site deployments, set `set $unmask_site "blog";` etc. in the
    # server block and pass it through.
    proxy_set_header X-Unmask-Site   $unmask_site;
    # Client JA4 (forward-auth mode). If a JA4-extracting layer sits in front
    # (= a GCP LB with a custom request header, or a front nginx running a
    # JA4 plugin), forward the fingerprint here. unmask-admin honors it only
    # when `challenge.ja4_source: header` is set and this nginx's IP is in
    # `trusted_forward_auth_proxies`. The source variable depends on YOUR JA4
    # layer: a GCP LB custom header arrives as $http_x_client_ja4; a JA4
    # plugin exposes its own variable. Match the value below, then uncomment.
    # proxy_set_header X-Client-JA4  $http_x_client_ja4;
    # Pass cookies through untouched (= unmask-admin needs to see _bv / _br).
    proxy_set_header Cookie          $http_cookie;
    proxy_connect_timeout 1s;
    proxy_read_timeout    2s;
    proxy_send_timeout    1s;
    # Behavior when the admin is down: use error_page to fail-open.
    # For strict operation, drop the error_page line so 502 propagates (= fail-close).
    proxy_intercept_errors on;
    error_page 502 503 504 = @unmask_fail_open;
}

# -------- named location for 401 (= challenge) --------
location @unmask_challenge {
    # The challenge HTML / JS is served directly by unmask-admin.
    rewrite ^ /unmask/challenge/ break;
    proxy_pass http://unmask_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

# -------- named location for 403 (= block) --------
location @unmask_blocked {
    return 403 "Access denied by unmask\n";
    add_header Content-Type "text/plain; charset=utf-8";
}

# -------- fail-open when the admin cannot respond --------
# So that the whole site does not 502 when unmask-admin is down, fall through
# to the normal forwarding path.  For strict operation (= bot blocking is
# more important), delete this location and let 502 propagate.
location @unmask_fail_open {
    # Write the normal backend forwarding here.
    # Example: try_files $uri $uri/ /index.html;
    # Example: proxy_pass http://your-app-backend;
    return 200;
}

# -------- proxy_pass the challenge serving + verify API to admin --------
# unmask challenge HTML lives at /unmask/challenge/, verify API at /unmask/api/.
# nginx forwards both straight to admin.
location ^~ /unmask/ {
    proxy_pass http://unmask_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    # challenge.js / verify both set and read cookies, so headers must pass through.
    proxy_pass_request_headers on;
}

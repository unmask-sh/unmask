# unmask auth gateway for Apache 2.4+ — mod_lua + luasocket forward-auth.
#
# Purpose: for environments where the nginx module is not an option.  With
#          mod_lua + lua-socket installed, dropping in this file and
#          apache-unmask.lua makes every request consult unmask and
#          pass / challenge / block.
#
# Functional limitations:
#   - JA4 fingerprint cannot be obtained (= it needs TLS handshake details).
#   - Everything else (= UA filter / honeypot / persistent BAN / behavioral
#     CAPTCHA / protected paths / search-bot two-stage rescue / rate_limit /
#     dashboard / cookie-pass-rate chart) still works.
#
# Required modules / packages:
#   - mod_proxy, mod_proxy_http  (for the /unmask/* passthrough below)
#   - mod_lua                    (RHEL: built into httpd / Debian: apache2-bin)
#   - mod_headers
#   - mod_rewrite                (exposes the real connecting peer for the JA4 gate)
#   - lua-socket                 (RHEL: EPEL `lua-socket` / Debian: `lua-socket`)
#                                mod_lua has no HTTP client, so the call to
#                                unmask goes through luasocket.
#
# Installation (RHEL example):
#   sudo dnf install mod_lua lua-socket          # lua-socket is in EPEL
#   sudo cp /usr/share/unmask/snippets/apache-forward-auth.conf /etc/httpd/conf.d/unmask.conf
#   sudo cp /usr/share/unmask/snippets/apache-unmask.lua        /etc/httpd/unmask.lua
#   sudo systemctl restart httpd
#
# Debian / Ubuntu:
#   sudo apt install lua-socket
#   sudo a2enmod proxy proxy_http lua headers rewrite
#   sudo cp /usr/share/unmask/snippets/apache-forward-auth.conf /etc/apache2/conf-available/unmask.conf
#   sudo cp /usr/share/unmask/snippets/apache-unmask.lua        /etc/apache2/unmask.lua
#   sudo a2enconf unmask && sudo systemctl reload apache2

# ---- /unmask/* passthrough to unmask ----
# The challenge page, static assets, verify API, and the admin UI all live on
# unmask.  This proxy is global so /unmask/admin/setup/ is reachable
# from every VirtualHost without any further editing.  Change 127.0.0.1:9477
# if unmask runs elsewhere (= server.port in /etc/unmask/config.yml).
#
# Block the forward-auth DECISION endpoint from the public passthrough: it is the
# handler that records bans / counts rate by client IP, and is meant to be hit
# ONLY by the internal check (apache-unmask.lua calls it over luasocket, not via
# this ProxyPass).  Left public, a direct client could reach it with a forged
# X-Real-IP / X-Forwarded-For and poison another IP's ban / rate state (e.g. get
# a search engine banned).  The `!` exclusion must precede the general rule.
ProxyPass        /unmask/api/check  !
ProxyPass        /unmask/  http://127.0.0.1:9477/unmask/  retry=0
ProxyPassReverse /unmask/  http://127.0.0.1:9477/unmask/

# ---- Anti-spoof: neutralize client-supplied verdict headers ----
# A visitor could otherwise send these headers itself and have the daemon
# record a forged verdict / honeypot hit / site identity (audit integrity —
# the shipped nginx snippets strip the same set).  mod_headers is
# already listed as a required module above.
RequestHeader unset X-JA4-Verdict
RequestHeader unset X-JA4-Action
RequestHeader unset X-Honeypot-Hit
RequestHeader unset X-Protected-Mode
RequestHeader unset X-Banned
RequestHeader unset X-Unmask-Site
RequestHeader unset X-Unmask-Conn-Peer
RequestHeader unset X-Original-URI
RequestHeader unset X-Original-IP
RequestHeader unset X-Original-UA
RequestHeader unset X-Original-Host
RequestHeader unset X-Original-Method

# X-Client-JA4 is the one header that may legitimately arrive from outside:
# unmask consumes a JA4 fingerprint forwarded via it.  Apache cannot produce JA4
# itself — it only relays whatever header arrives — so a client reaching Apache
# directly could forge one.  unmask gates this SERVER-SIDE: the lua reports the
# real connecting peer (see the per-vhost RewriteRule below) and the daemon honors the JA4
# ONLY when that peer is a configured trusted LB/CDN (admin → Settings → Network
# → "trusted LB / CDN", the same list nginx uses).  So you do NOT need to strip
# X-Client-JA4 by hand — a forged JA4 from a non-LB client is dropped by the
# daemon.  (A front LB overwriting any client-sent value is still good practice.)

# ---- ON/OFF switch + JA4 gate (= per-VirtualHost, opt-in) ----
# Equivalent to nginx's `include /etc/unmask/native/protect.inc;`.  Installing
# the package does NOT auto-protect every VirtualHost — to enable unmask on a
# given VirtualHost, paste the lines below inside its <VirtualHost> block (and
# reload Apache).  Removing them turns unmask off again.
#
# Default (= globally enabled on every VirtualHost) is intentionally disabled
# so an install does not silently change traffic behaviour on an existing
# multi-vhost server.
#
#   <VirtualHost *:443>
#       ServerName example.com
#       ...
#       # JA4 gate: hand the daemon the real connecting peer so it can confirm a
#       # forwarded X-Client-JA4 actually arrived via a trusted LB.
#       # %{CONN_REMOTE_ADDR} is the real TCP peer (the LB / CDN when Apache is
#       # behind one) and, unlike %{REMOTE_ADDR}, mod_remoteip does NOT rewrite
#       # it.  This MUST live in the vhost: mod_rewrite rules do not inherit into
#       # vhosts from server scope.  (Needs mod_rewrite; a2enmod rewrite.)
#       RewriteEngine On
#       RewriteRule .* - [E=UNMASK_CONN_PEER:%{CONN_REMOTE_ADDR}]
#       # Turn unmask on for this vhost:
#       LuaHookAccessChecker /etc/httpd/unmask.lua handle_request
#   </VirtualHost>
#
# On Debian / Ubuntu the Lua file lives at /etc/apache2/unmask.lua:
#   LuaHookAccessChecker /etc/apache2/unmask.lua handle_request
#
# Without the RewriteRule unmask still works, but the JA4 gate degrades: the
# daemon can no longer confirm the LB origin, so a forwarded X-Client-JA4 is
# accepted on the proxy-peer check alone (weaker).  Add it whenever a front
# LB / CDN forwards JA4.

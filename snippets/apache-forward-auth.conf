# unmask auth gateway for Apache 2.4+ — mod_lua based forward-auth.
#
# Purpose: for environments where the nginx module is not an option.  As long
#          as Apache has mod_lua + mod_proxy_http, dropping in this file and
#          apache-unmask.lua makes every request consult unmask-admin and
#          pass / challenge / block.
#
# Functional limitations:
#   - JA4 fingerprint cannot be obtained (= it needs TLS handshake details).
#   - Everything else (= UA filter / honeypot / persistent BAN / behavioral
#     CAPTCHA / protected paths / search-bot two-stage rescue / rate_limit /
#     dashboard / cookie-pass-rate chart) still works.
#
# Required modules (= standard on virtually every distro):
#   - mod_proxy
#   - mod_proxy_http
#   - mod_lua          (RHEL: yum install mod_lua / Debian: libapache2-mod-lua)
#   - mod_rewrite      (optional)
#   - mod_headers
#
# Installation (RHEL example):
#   sudo cp /usr/share/unmask/snippets/apache-forward-auth.conf /etc/httpd/conf.d/unmask.conf
#   sudo cp /usr/share/unmask/snippets/apache-unmask.lua        /etc/httpd/unmask.lua
#   sudo systemctl restart httpd
#
# Debian / Ubuntu:
#   sudo a2enmod proxy proxy_http lua headers
#   sudo cp /usr/share/unmask/snippets/apache-forward-auth.conf /etc/apache2/conf-available/unmask.conf
#   sudo cp /usr/share/unmask/snippets/apache-unmask.lua        /etc/apache2/unmask.lua
#   sudo a2enconf unmask && sudo systemctl reload apache2

# ---- internal proxy to unmask-admin ----
# Loopback port unmask-admin is listening on (= server.port in admin.yml).
# Change 127.0.0.1:9477 if needed.
ProxyPass        /unmask/    http://127.0.0.1:9477/unmask/    retry=0 timeout=5
ProxyPassReverse /unmask/    http://127.0.0.1:9477/unmask/

# ---- internal subrequest endpoint (= called from mod_lua via r:lookup_uri) ----
# External access is forbidden (= /_unmask/* prefix).  Loopback only.
<Location /_unmask/>
    Require ip 127.0.0.1
    Require ip ::1
</Location>
ProxyPass        /_unmask/check  http://127.0.0.1:9477/unmask/api/check  retry=0 timeout=2
ProxyPassReverse /_unmask/check  http://127.0.0.1:9477/unmask/api/check

# ---- apply the mod_lua handler to every request ----
# Hook in the AccessChecker phase (= before auth, after mod_proxy / mod_rewrite).
# /unmask/* and /_unmask/* are skipped inside the handler, so no side effects.
LuaHookAccessChecker /etc/httpd/unmask.lua handle_request

# ---- Note ----
# On Debian / Ubuntu the Lua file path becomes /etc/apache2/unmask.lua:
#   LuaHookAccessChecker /etc/apache2/unmask.lua handle_request
# Same idea if you want a custom path.

# unmask auth gateway for Apache 2.4+ — mod_lua + luasocket forward-auth.
#
# Purpose: for environments where the nginx module is not an option.  With
#          mod_lua + lua-socket installed, dropping in this file and
#          apache-unmask.lua makes every request consult unmask and
#          pass / challenge / block.
#
# Functional limitations:
#   - JA4 fingerprint cannot be obtained (= it needs TLS handshake details).
#   - Everything else (= UA filter / honeypot / persistent BAN / behavioral
#     CAPTCHA / protected paths / search-bot two-stage rescue / rate_limit /
#     dashboard / cookie-pass-rate chart) still works.
#
# Required modules / packages:
#   - mod_proxy, mod_proxy_http  (for the /unmask/* passthrough below)
#   - mod_lua                    (RHEL: built into httpd / Debian: apache2-bin)
#   - mod_headers
#   - lua-socket                 (RHEL: EPEL `lua-socket` / Debian: `lua-socket`)
#                                mod_lua has no HTTP client, so the call to
#                                unmask goes through luasocket.
#
# Installation (RHEL example):
#   sudo dnf install mod_lua lua-socket          # lua-socket is in EPEL
#   sudo cp /usr/share/unmask/snippets/apache-forward-auth.conf /etc/httpd/conf.d/unmask.conf
#   sudo cp /usr/share/unmask/snippets/apache-unmask.lua        /etc/httpd/unmask.lua
#   sudo systemctl restart httpd
#
# Debian / Ubuntu:
#   sudo apt install lua-socket
#   sudo a2enmod proxy proxy_http lua headers
#   sudo cp /usr/share/unmask/snippets/apache-forward-auth.conf /etc/apache2/conf-available/unmask.conf
#   sudo cp /usr/share/unmask/snippets/apache-unmask.lua        /etc/apache2/unmask.lua
#   sudo a2enconf unmask && sudo systemctl reload apache2

# ---- /unmask/* passthrough to unmask ----
# The challenge page, static assets, verify API, and the admin UI all live on
# unmask.  This proxy is global so /unmask/admin/setup/ is reachable
# from every VirtualHost without any further editing.  Change 127.0.0.1:9477
# if unmask runs elsewhere (= server.port in /etc/unmask/config.yml).
ProxyPass        /unmask/  http://127.0.0.1:9477/unmask/  retry=0
ProxyPassReverse /unmask/  http://127.0.0.1:9477/unmask/

# ---- Anti-spoof: neutralize client-supplied X-Client-JA4 ----
# unmask can consume a JA4 fingerprint forwarded via the X-Client-JA4
# request header (enable challenge.ja4_source=header in the admin UI). Apache
# cannot produce JA4 itself — it only relays whatever header arrives — so a
# client reaching Apache directly could forge its own JA4.
#
#   - If a JA4-aware layer (a load balancer, or a front nginx with a JA4
#     plugin) sits in front of Apache and sets X-Client-JA4, that layer must
#     OVERWRITE any client-sent value. Most LBs do this by design.
#   - If there is NO such front layer, clear the header unconditionally so a
#     forged value can never reach unmask — uncomment the line below
#     (needs mod_headers, already listed as a required module above):
#
# RequestHeader unset X-Client-JA4

# ---- ON/OFF switch (= per-VirtualHost, opt-in) ----
# Equivalent to nginx's `include /etc/unmask/native/protect.inc;`.  Installing
# the package does NOT auto-protect every VirtualHost — to enable unmask on a
# given VirtualHost, paste this single line inside its <VirtualHost> block
# (and reload Apache).  Removing the line turns unmask off again.
#
# Default (= globally enabled on every VirtualHost) is intentionally disabled
# so an install does not silently change traffic behaviour on an existing
# multi-vhost server.
#
#   <VirtualHost *:443>
#       ServerName example.com
#       ...
#       LuaHookAccessChecker /etc/httpd/unmask.lua handle_request
#   </VirtualHost>
#
# On Debian / Ubuntu the Lua file lives at /etc/apache2/unmask.lua:
#   LuaHookAccessChecker /etc/apache2/unmask.lua handle_request

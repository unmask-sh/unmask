# unmask with Docker Compose -- the admin daemon plus nginx with the module.
#
#   1. Put a TLS certificate for your site in ./tls/ (fullchain.pem, privkey.pem).
#      For a first look, a self-signed pair will do:
#        mkdir -p tls && openssl req -x509 -nodes -newkey rsa:2048 -days 30 \
#          -keyout tls/privkey.pem -out tls/fullchain.pem -subj "/CN=localhost"
#   2. docker compose -f docker-compose.example.yml up -d
#   3. docker compose -f docker-compose.example.yml logs admin | grep "setup token"
#   4. open https://localhost/unmask/admin/  -> install wizard (paste the token)
#
# Two containers, same shape as a host install:
#
#   admin   the daemon: admin UI, challenge verification, ban list, stats.
#           On first start it writes a minimal admin.yml, migrates the DB,
#           renders the nginx includes into /etc/unmask, then serves.
#   nginx   the official nginx image + the unmask module.  Terminates TLS
#           (that is where JA4 comes from), classifies, and either serves the
#           challenge or proxies to UNMASK_UPSTREAM.  With UNMASK_UPSTREAM
#           unset it is a plain nginx-with-module and your own conf.d applies.
#
# The volumes are not optional: /etc/unmask carries the rendered includes
# (nginx reads what admin wrote) and the secrets; drop it and every restart
# mints new secrets, which logs every visitor out and re-challenges them.
#
# Settings changed in the admin UI are rendered into the shared volume and the
# nginx container reloads itself within a few seconds (after nginx -t; a render
# that does not parse is logged and skipped).  UNMASK_AUTORELOAD=0 disables that.

services:
  admin:
    image: ghcr.io/unmask-sh/admin:latest
    build: .                       # or build from this checkout
    container_name: unmask-admin
    restart: unless-stopped
    environment:
      TZ: Asia/Tokyo
      # The rendered nginx config proxies /unmask/ here; "admin" is this
      # service's name on the compose network.
      UNMASK_DAEMON_ADDR: admin:9477
      # Gateway vhost, seeded into settings > Gateway on the first boot and
      # editable in the admin UI from then on (hostname, certificate source).
      UNMASK_SERVER_NAME: localhost     # your hostname; "_" matches any
      # TLS, one of:
      #  (a) your own files, mounted on the nginx container (the default):
      # UNMASK_TLS_CERT: /etc/unmask/tls/fullchain.pem
      # UNMASK_TLS_KEY:  /etc/unmask/tls/privkey.pem
      #  (b) automatic HTTPS: set the contact address and nginx's own ACME
      #      module obtains and renews a Let's Encrypt certificate for
      #      UNMASK_SERVER_NAME (a real hostname; :80 reachable from the
      #      internet for the http-01 challenge).  Nothing else to run.
      # UNMASK_ACME_EMAIL: you@example.com
      # UNMASK_ACME_DIRECTORY: https://acme-staging-v02.api.letsencrypt.org/directory  # staging, while testing
      #  (c) paste a purchased certificate in the admin UI (settings > Gateway).
      # Where the admin reaches the gateway to show the served certificate.
      UNMASK_GATEWAY_ADDR: nginx:443
    volumes:
      - unmask-config:/etc/unmask
      - unmask-data:/var/lib/unmask
      - unmask-run:/run/unmask      # access-log socket, nginx -> admin
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9477/unmask/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  nginx:
    image: ghcr.io/unmask-sh/nginx:1.28
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: unmask-nginx
    restart: unless-stopped
    depends_on:
      admin:
        condition: service_healthy
    environment:
      TZ: Asia/Tokyo
      # Gateway mode: terminate TLS on :443, challenge what needs it, proxy
      # the rest to this URL.  Any HTTP server works as the upstream; nothing
      # is installed on it.  Remove this variable to run module-only with your
      # own conf.d mounted at /etc/nginx/conf.d.
      UNMASK_UPSTREAM: http://app:80
      # The vhost name and certificate are settings > Gateway in the admin
      # (seeded from the admin service's environment above).
    volumes:
      - unmask-config:/etc/unmask:ro
      - unmask-run:/run/unmask
      - ./tls:/etc/unmask/tls:ro
      - unmask-acme:/var/cache/nginx/unmask-acme   # ACME account + certificate; keep it
    ports:
      - "80:80"
      - "443:443"

  # Stand-in upstream so the example answers on its own.  Replace with your
  # application, or point UNMASK_UPSTREAM at one running elsewhere.
  app:
    image: traefik/whoami
    container_name: unmask-example-app
    restart: unless-stopped

volumes:
  unmask-config:
  unmask-data:
  unmask-run:
  unmask-acme:

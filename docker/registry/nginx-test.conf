# Test server for the static registry include: CI serves a tree generated by
# tools/oci-static-registry.py on plain HTTP and pulls from it with docker.
# unmask.sh carries the same include inside its vhost.
server {
    listen 80;
    server_name _;
    root /var/www/unmask.sh;
    include /etc/nginx/unmask-registry/oci-static.inc;
    location / { return 404; }
}

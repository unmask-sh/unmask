# unmask.sh static container registry -- http scope.
#
# Load it AFTER the unmask http include (conf.d/00-unmask.conf on unmask.sh):
# a map block fixes the map hash sizes, and a map_hash_bucket_size that
# follows one is "duplicate".  conf.d/zz-unmask-registry-map.conf is the
# name that sorts last.
#
# A manifest requested by digest gets Docker-Content-Digest for free (the
# reference is the digest); a tag request does not carry one and clients
# compute it from the body.  nginx drops a header whose value is empty.
map $oci_ref $oci_ref_digest {
    "~^sha256:[0-9a-f]{64}$"  $oci_ref;
    default                 "";
}

# unmask: JA4 ベース bot challenge の nginx config (= http {} スコープ).
#
# このファイルは `http { include /etc/unmask/nginx/unmask.conf; }` で読み込む.
# ja4 module (= ngx_http_ja4_module.so) は別途 `load_module` 必要:
#
#   load_module /usr/lib/nginx/modules/ngx_http_ja4_module.so;
#
# server {} 側に必要なものは unmask-server.conf を別 include する.

# ============================================================================
# 検索 / AI / 広告 bot UA — challenge 免除 (= 順位事故防止)
# ============================================================================
# 検索 bot を challenge に飛ばすと JS が動かず詰まり、 インデックス除外 → 順位下落の事故.
# /etc/unmask/nginx/search-bots.conf には Googlebot/Bingbot/GPTBot/ClaudeBot 等が並ぶ.
# 必要に応じて追加すること.
include /etc/unmask/nginx/search-bots.conf;

# ============================================================================
# Google 公式 IP 範囲 (UA 救済の二段目)
# ============================================================================
# Search Console URL検査ツール / WRS (Web Rendering Service) 等は UA に Googlebot を
# 含まないことがあるので、 IP range で救済する. 約 2,000 範囲を許可.
# `unmask-cli build-google-ip` (実装予定) で更新.
include /etc/unmask/nginx/google-ip.conf;

# ============================================================================
# JA4 fingerprint → verdict (= bot_*, suspect_*, ok)
# ============================================================================
# load_module した ngx_http_ja4_module が $client_ja4 を提供する前提.
# GCP LB 等で他経路から JA4 が来る場合は X-Client-JA4 ヘッダで上書きできるよう map.
map $http_x_client_ja4 $effective_ja4 {
    ""      $client_ja4;
    default $http_x_client_ja4;
}

# 詳細な mapping は /etc/unmask/nginx/ja4-verdict.conf に切り出して運用更新可能に.
# (= 観測ログから新種 bot を発見したら追記する運用)
map $effective_ja4 $ja4_verdict {
    default "ok";
    include /etc/unmask/nginx/ja4-verdict.map;
}

# verdict が bot_* なら 1 (= challenge HTML が PoW skip → 即 CAPTCHA 直行).
map $ja4_verdict $ja4_hit_flag {
    default "0";
    "~^bot_" "1";
}

# ============================================================================
# 既知ブラウザ判定 ($is_known_browser)
# ============================================================================
# challenge 発動条件 = (UA がブラウザ偽装) AND (JA4 が bot 確定).
# 素直な curl/python-requests/独自 bot UA にはそもそも challenge を出さない.
map $http_user_agent $is_known_browser {
    default 0;
    "~^Mozilla/5\.0\s.*\sChrome/[0-9]"   1;
    "~^Mozilla/5\.0\s.*\sSafari/[0-9]"   1;
    "~^Mozilla/5\.0\s.*\sFirefox/[0-9]"  1;
    "~^Mozilla/5\.0\s.*\sEdg(e)?/[0-9]"  1;
    "~Mozilla/5\.0\s.*\sOPR/[0-9]"       1;
    "~^Opera/[0-9]"                       1;
}

# ============================================================================
# _bv cookie 検証 (= CAPTCHA 通過済みフラグ. 3 日間有効)
# ============================================================================
# 検証は ngx_http_ja4_module が提供する $unmask_bv_valid 変数で行う (= inline,
# 0 RTT). secret は admin app と同じ値を `unmask_bv_secret` で設定する.
#
#   unmask_bv_secret <BV_SECRET>;       # admin の config.yml の secret.bv_secret と同期
#   unmask_bv_valid_days 3;             # default 3 日
#
# これらは module load 後に有効になる HTTP main scope の directive.
# /etc/unmask/nginx/secret.conf に分離して 0600 で配布する想定.
include /etc/unmask/nginx/secret.conf;

# `$bv_valid` という名前で他 map から参照したいので alias 用 map.
map $unmask_bv_valid $bv_valid {
    default $unmask_bv_valid;
}

# ============================================================================
# Honeypot path / UA 汚染検知 ($serve_bot_challenge)
# ============================================================================
# wp-login.php / xmlrpc.php / .env 等の bot 専用 path を踏んだ session を challenge に.
# 値は server {} 内で `if ($request_uri ~ ...) { set $serve_bot_challenge 1; }` で立てる
# 想定だが、 デフォルト 0 を map で用意.
map $host $serve_bot_challenge_default { default "0"; }

# ============================================================================
# $final_challenge — challenge 発動の最終判定
# ============================================================================
#  入力 6 シグナル (この順序で文字列連結):
#    $bv_valid             _bv cookie の HMAC 検証 OK
#    $is_search_bot        UA が Googlebot/Bingbot 等の正規 crawler
#    $is_google_ip         Google 公式 IP 範囲
#    $is_known_browser     UA が Chrome/Safari/Firefox/Edge を名乗る
#    $ja4_verdict          TLS fingerprint
#    $serve_bot_challenge  Honeypot 踏み
#
#  発動条件:
#    is_known_browser=1 AND (ja4_verdict が bot_* OR serve_bot_challenge=1)
#  免除:
#    bv_valid=1, is_search_bot=1, is_google_ip=1, is_known_browser=0
map "$bv_valid:$is_search_bot:$is_google_ip:$is_known_browser:$ja4_verdict:$serve_bot_challenge" $final_challenge {
    default 0;
    "~^1:"             0;  # _bv 有効 → 免除
    "~^0:1:"           0;  # 検索 bot UA → 免除
    "~^0:0:1:"         0;  # Google 公式 IP → 免除
    "~^0:0:0:0:"       0;  # 既知ブラウザでない → 免除
    "~^0:0:0:1:bot_"   1;  # 偽装ブラウザ + JA4 bot → challenge
    "~^0:0:0:1:.*:1$"  1;  # 偽装ブラウザ + Honeypot → challenge
}

# ============================================================================
# レート制限 (= 同 IP 100r/min 超 → CAPTCHA 直行)
# ============================================================================
# 検索 bot 系は除外 (= 大規模 crawl 時に CAPTCHA で詰まると順位事故再発).
map "$bv_valid:$is_search_bot:$is_google_ip" $rate_limit_key {
    default     $binary_remote_addr;
    "~^1:"      "";          # CAPTCHA 通過済 → 除外
    "~^.:1:"    "";          # 検索 bot UA → 除外
    "~^.:.:1$"  "";          # Google 公式 IP → 除外
}
limit_req_zone $rate_limit_key zone=unmask_rate:10m rate=100r/m;

# ============================================================================
# rate limit 経由かどうかの判別
# ============================================================================
map $args $rl_hit {
    default "0";
    "~_rl=1" "1";
}

# ============================================================================
# upstream (= unmask-admin)
# ============================================================================
# admin app は 127.0.0.1:8765 default. systemd unit と config.yml で揃える.
upstream unmask_admin {
    server 127.0.0.1:8765;
    keepalive 8;
}

# ============================================================================
# log format (運用調査用)
# ============================================================================
log_format unmask '$remote_addr [$time_local] "$request" $status '
                  '"$http_user_agent" '
                  'ja4=$effective_ja4 v=$ja4_verdict '
                  'bv=$bv_valid bp=$bot_challenge_passed rl=$rl_hit';

# Google 公式 IP 範囲 ($is_google_ip).
#
# Search Console URL検査ツール / WRS (Web Rendering Service) / Page Experience テスト等は
# UA に Googlebot を含まないため、 IP range で救済する.
#
# このファイルはプレースホルダ. 実際の範囲は `unmask-cli build-google-ip` で
# 公式 JSON (googlebot.json + special-crawlers.json + user-triggered-fetchers*.json)
# から生成し、 ここを上書きする (= 約 2,000 範囲).
#
# 公式 JSON 配布元:
#   https://developers.google.com/static/search/apis/ipranges/googlebot.json
#   https://developers.google.com/static/search/apis/ipranges/special-crawlers.json
#   https://developers.google.com/static/search/apis/ipranges/user-triggered-fetchers.json
geo $is_google_ip {
    default 0;
    # 例 (実環境では unmask-cli build-google-ip で上書きする):
    # 66.249.64.0/19  1;
    # 64.233.160.0/19 1;
    # 72.14.192.0/18  1;
    # ...
}

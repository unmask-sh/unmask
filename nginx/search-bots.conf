# 検索エンジン / AI crawler / 広告 bot の UA 判定 ($is_search_bot).
# challenge は絶対に通す対象. 順位事故の防止に必須.
map $http_user_agent $is_search_bot {
    default 0;
    # Google
    "~*Googlebot"                1;
    "~*Google-InspectionTool"    1;
    "~*Mediapartners-Google"     1;
    "~*AdsBot-Google"            1;
    # Bing
    "~*bingbot"                  1;
    "~*msnbot"                   1;
    "~*BingPreview"              1;
    # Yahoo
    "~*Slurp"                    1;
    # Naver
    "~*Yeti/"                    1;
    # Yandex
    "~*YandexBot"                1;
    "~*YandexImages"             1;
    "~*YandexAccessibilityBot"   1;
    # Baidu
    "~*Baiduspider"              1;
    # Sogou
    "~*Sogou web spider"         1;
    # DuckDuckGo
    "~*DuckDuckBot"              1;
    # Apple
    "~*Applebot"                 1;
    # OpenAI
    "~*GPTBot"                   1;
    "~*ChatGPT-User"             1;
    "~*OAI-SearchBot"            1;
    # Anthropic
    "~*ClaudeBot"                1;
    # Perplexity
    "~*PerplexityBot"            1;
    # Internet Archive
    "~*ia_archiver"              1;
    # Huawei
    "~*PetalBot"                 1;
    # Coc Coc (Vietnam)
    "~*coccocbot"                1;
    # Seznam (Czech)
    "~*SeznamBot"                1;
    # Qwant (France)
    "~*Qwantify"                 1;
}

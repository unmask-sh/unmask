# server {} スコープに include する unmask 設定.
#
# 使い方:
#
#   server {
#       listen 443 ssl http2;
#       server_name example.com;
#       ssl_certificate / ssl_certificate_key ...;
#       include /etc/unmask/nginx/unmask-server.conf;
#       location / {
#           limit_req zone=unmask_rate burst=50 nodelay;
#           error_page 429 = @unmask_rate_challenge;
#           if ($final_challenge = 1) {
#               rewrite ^ /unmask/challenge/ last;
#           }
#           # 元の handling
#           proxy_pass http://backend;
#       }
#   }
#
# _bv cookie の検証は ngx_http_ja4_module の $unmask_bv_valid 変数で inline 完結.
# auth_request は不要 (= 0 RTT, 0 サブリクエスト).

# --------------------------------------------------------------------------
# challenge endpoints — admin app に proxy_pass
# --------------------------------------------------------------------------
# /unmask/challenge/ と /unmask/challenge/<site>/ の両方を admin に proxy.
# `^~` で正規表現より優先してこの prefix を取る.
location ^~ /unmask/challenge/ {
    proxy_pass        http://unmask_admin;
    proxy_set_header  Host             $host;
    proxy_set_header  X-Real-IP        $remote_addr;
    proxy_set_header  X-Client-JA4     $effective_ja4;
    proxy_set_header  X-JA4-Verdict    $ja4_verdict;
    # rate-limit ヒット時の原 path は @unmask_rate_challenge の rewrite 内で
    # クエリに ?_orig=$uri 形で乗せるので、 ヘッダ追加は不要.
    # challenge HTML 自体には challenge を出さない (= 無限 loop 防止).
    proxy_intercept_errors off;
}
# 旧 path 互換 (= 1.0 前なので近いうちに削除予定).
location = /unmask/challenge.html {
    return 301 /unmask/challenge/$is_args$args;
}

location ^~ /unmask/api/ {
    proxy_pass        http://unmask_admin;
    proxy_set_header  Host             $host;
    proxy_set_header  X-Real-IP        $remote_addr;
    proxy_set_header  X-Client-JA4     $effective_ja4;
    proxy_set_header  X-JA4-Verdict    $ja4_verdict;
}

# --------------------------------------------------------------------------
# rate-limit 超過時の named location
# --------------------------------------------------------------------------
# 個別 location ブロックで `error_page 429 = @unmask_rate_challenge;` で参照する.
# 原 URI ($request_uri = path + query) をそのまま path に埋め込んで admin に渡す.
# 例: 原 = "/foo?a=1" → "/unmask/_rl/foo?a=1"
#   - nginx は最初の "?" で path/query を split → path="/unmask/_rl/foo", args="a=1"
#   - admin は URL.Path から "/_rl/" 以降を切り出し, RawQuery と合わせて原 URI 復元
#   - rl=1 は path prefix "/_rl/" 自体が暗黙にマーカーとなる
# (= /unmask/challenge/{site}/ の routing と衝突しないよう, 別 namespace にしている)
location ^~ /unmask/_rl/ {
    proxy_pass        http://unmask_admin;
    proxy_set_header  Host             $host;
    proxy_set_header  X-Real-IP        $remote_addr;
    proxy_set_header  X-Client-JA4     $effective_ja4;
    proxy_set_header  X-JA4-Verdict    $ja4_verdict;
    proxy_intercept_errors off;
}
location @unmask_rate_challenge {
    rewrite ^ /unmask/_rl$request_uri last;
}

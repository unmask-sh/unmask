# nginx config for the multi-site-native scenario (phase 2.2).
#
# Same vhost layout as multi-site-basic (3 vhosts on :8445 -- shop.local,
# blog.local, default.example) but the decision path goes through the native
# unmask module + the rendered /etc/unmask/native/*.inc rather than
# auth_request.  This verifies the phase 2.2 map $host blocks produce the
# right per-site $protected_mode value for the native plugin.

load_module /usr/lib/nginx/modules/ngx_http_unmask_module.so;
worker_processes 1;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;
events {}
http {
    client_body_temp_path /var/lib/nginx/body;
    proxy_temp_path       /var/lib/nginx/proxy;
    fastcgi_temp_path     /var/lib/nginx/fastcgi;
    uwsgi_temp_path       /var/lib/nginx/uwsgi;
    scgi_temp_path        /var/lib/nginx/scgi;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # http {} conf rendered by admin (= /etc/unmask/native/http.inc).
    # Provides $is_search_bot / $ja4_verdict / $ja4_action / $bv_kind /
    # $final_challenge / $rate_limit_key / $protected_mode + the per-host
    # map blocks phase 2.2 adds for site-specific overrides.
    include /etc/unmask/native/http.inc;

    # Docker DNS for "admin" overrides the rendered 127.0.0.1:9477 upstream.
    upstream unmask_admin {
        server admin:9477;
        keepalive 8;
    }

    server {
        listen 8445 ssl default_server;
        ssl_certificate     /etc/nginx/cert.pem;
        ssl_certificate_key /etc/nginx/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        server_name shop.local;

        include /etc/unmask/native/server.inc;

        location / {
            include /etc/unmask/native/protect.inc;
            try_files /__nonexistent @shop_origin;
        }
        location @shop_origin {
            default_type text/plain;
            return 200 "[shop.local OK $request_uri]\n";
        }
    }

    server {
        listen 8445 ssl;
        ssl_certificate     /etc/nginx/cert.pem;
        ssl_certificate_key /etc/nginx/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        server_name blog.local;

        include /etc/unmask/native/server.inc;

        location / {
            include /etc/unmask/native/protect.inc;
            try_files /__nonexistent @blog_origin;
        }
        location @blog_origin {
            default_type text/plain;
            return 200 "[blog.local OK $request_uri]\n";
        }
    }

    server {
        listen 8445 ssl;
        ssl_certificate     /etc/nginx/cert.pem;
        ssl_certificate_key /etc/nginx/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        server_name default.example;

        include /etc/unmask/native/server.inc;

        # The "no-override" vhost.  Inherits the default protected_paths
        # (/admin/) -- nothing per-host overrides it.
        location / {
            include /etc/unmask/native/protect.inc;
            try_files /__nonexistent @default_origin;
        }
        location @default_origin {
            default_type text/plain;
            return 200 "[default.example OK $request_uri]\n";
        }
    }
}

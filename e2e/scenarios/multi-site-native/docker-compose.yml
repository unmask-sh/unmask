# multi-site-native scenario (phase 2.2): one unmask-admin + one nginx with
# the native ngx_http_unmask_module + 3 vhosts (shop.local + blog.local +
# default.example).  Self-contained -- the only inputs are this dir's files
# (admin.yml, nginx.conf).
#
# Start:
#   docker compose -f e2e/scenarios/multi-site-native/docker-compose.yml up -d --build --wait
#
# Run assertions:
#   ./e2e/scenarios/multi-site-native/run.sh
#
# Tear down:
#   docker compose -f e2e/scenarios/multi-site-native/docker-compose.yml down -v
#
# Why a separate scenario from multi-site-basic:
#   multi-site-basic exercises the admin-side Resolve(site) path through
#   auth_request.  multi-site-native exercises the rendered per-host map
#   blocks ($protected_mode_host_<host> + $protected_mode_disable) the
#   native module reads from /etc/unmask/native/http.inc.  Phase 2.2's
#   deliverable is "Resolve(site) takes effect on BOTH modes" so the two
#   scenarios run side-by-side.

name: unmask-e2e-multi-site-native

services:
  admin:
    build:
      context: ../../..
      dockerfile: e2e/docker/admin/Dockerfile
    volumes:
      - ./admin.yml:/etc/unmask/admin.yml:ro
      - unmask-data:/var/lib/unmask
      # /etc/unmask is rendered by admin and shared with the nginx
      # container so http.inc / server.inc / protect.inc pick up the
      # per-site map blocks.
      - unmask-etc:/etc/unmask
    entrypoint: []
    command: >
      sh -c "/usr/local/bin/unmask-admin migrate -config /etc/unmask/admin.yml &&
             /usr/local/bin/unmask-admin render-nginx -config /etc/unmask/admin.yml &&
             /usr/local/bin/unmask-admin serve   -config /etc/unmask/admin.yml"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9477/unmask/healthz"]
      interval: 2s
      timeout: 1s
      retries: 30

  nginx:
    build:
      context: ../../..
      dockerfile: e2e/docker/nginx/Dockerfile
    depends_on:
      admin:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - unmask-etc:/etc/unmask:ro
    ports:
      - "8445:8445"
    healthcheck:
      test: ["CMD-SHELL", "openssl s_client -connect 127.0.0.1:8445 -servername shop.local </dev/null >/dev/null 2>&1"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  unmask-data:
  unmask-etc:

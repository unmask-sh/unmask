# unmask-admin config for the multi-site-native scenario (phase 2.2).
#
# Same multi-site shape as multi-site-basic (= shop.local appends /checkout/,
# blog.local removes /admin/, default.example inherits the default /admin/),
# but exercised against the native nginx module path rather than
# auth_request.  The native module reads $protected_mode out of the per-host
# map blocks that admin/render-nginx writes to /etc/unmask/native/http.inc,
# so this scenario verifies the phase 2.2 map $host wiring round-trips
# through the rendered config.

db:
  driver: sqlite
  sqlite_path: /var/lib/unmask/unmask.sqlite

secret:
  bv_secret: "e2e-multi-site-native-bv-secret-do-not-use-in-prod"
  captcha_secret_base: "e2e-multi-site-native-captcha-base-do-not-use-in-prod"

challenge:
  mode: pow_then_captcha
  cookie_days: 3
  captcha_score_threshold: 0.5

server:
  bind: 0.0.0.0
  port: 9477
  base_path: /unmask

branding:
  site_name: "Default Co"
  copy_preset: friendly

# Real browser UAs pass by default so assertion 5 (blog.local/admin with the
# per-site Remove override) doesn't get challenged by the Global axis.
global:
  known_browser_action: pass
  unknown_ua_action:    pass

nginx_log:
  socket_path: ""

nginx:
  output_dir: /etc/unmask
  upstream_addr: admin:9477
  seen_version: v0.1.0
  admin_allow_from:
    - 0.0.0.0/0
  metrics_allow_from:
    - 0.0.0.0/0
  challenge_targets:
    all: false

  # Same per-site override shape as multi-site-basic.  Phase 2.2 renders
  # these into http.inc as $protected_mode_host_<host> + $protected_mode_disable
  # map blocks so the native module path honors them without an
  # auth_request round-trip.
  protected_paths:
    paths:
      - path: /admin/
        mode: captcha
    overrides:
      shop.local:
        append:
          - path: /checkout/
            mode: pow
      blog.local:
        remove: ["/admin/"]

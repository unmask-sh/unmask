# nginx config for multi-site-basic.  3 vhosts -- shop.local, blog.local, and
# a default catch-all -- all sharing one unmask-admin via auth_request.  The
# native unmask module is intentionally NOT loaded; this scenario verifies the
# admin-side per-site Resolve() path, which the module's $protected_mode map
# does not yet honor (= TODO(multi-site phase 2) in render.go).

worker_processes 1;
pid /run/nginx.pid;
events {}

http {
    # Default sendfile / temp paths from the stock nginx:1.26 image work fine;
    # only the access_log is redirected to /dev/stdout for compose log capture.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    upstream unmask_backend {
        server admin:9477;
        keepalive 16;
    }

    # Per-vhost site identifier surfaced to admin via X-Unmask-Site.  Empty
    # falls back to the X-Original-Host derivation (= what siteFromRequest
    # picks up from the proxy_set_header below).  Using the header (rather
    # than relying on auth_request_set $unmask_chmode) keeps the host -> site
    # mapping explicit and visible in nginx -T output.

    server {
        listen 8444 ssl default_server;
        ssl_certificate     /etc/nginx/cert.pem;
        ssl_certificate_key /etc/nginx/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        server_name shop.local;

        location / {
            auth_request /_unmask_check;
            error_page 401 = @unmask_challenge;
            error_page 403 = @unmask_blocked;

            # No real backend behind the protect -- when unmask says pass we
            # serve a tiny static 200 so the assertions can tell "passed
            # through" apart from "challenged".  try_files punts to a named
            # location so auth_request actually runs (= `return 200` here
            # would short-circuit in REWRITE phase before auth_request gets
            # a chance).
            try_files /__nonexistent @shop_origin;
        }
        location @shop_origin {
            default_type text/plain;
            return 200 "[shop.local OK $request_uri]\n";
        }

        location = /_unmask_check {
            internal;
            proxy_pass http://unmask_backend/unmask/api/check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host             $host;
            proxy_set_header X-Original-URI   $request_uri;
            proxy_set_header X-Original-IP    $remote_addr;
            proxy_set_header X-Original-UA    $http_user_agent;
            proxy_set_header X-Original-Host  $host;
            proxy_set_header Cookie           $http_cookie;
            proxy_connect_timeout 1s;
            proxy_read_timeout    2s;
            proxy_intercept_errors on;
            error_page 502 503 504 = @unmask_fail_open;
        }

        location @unmask_challenge {
            # admin serves the per-site branding-resolved HTML at this path.
            rewrite ^ /unmask/challenge/?_orig=$request_uri break;
            proxy_pass http://unmask_backend;
            proxy_set_header Host             $host;
            proxy_set_header X-Original-Host  $host;
            proxy_set_header X-Real-IP        $remote_addr;
        }

        location @unmask_blocked {
            default_type text/plain;
            return 403 "denied\n";
        }

        location @unmask_fail_open {
            default_type text/plain;
            return 200 "[shop.local fail-open $request_uri]\n";
        }

        # Direct admin pass-through for the challenge HTML / branding logo /
        # static assets fetched by the challenge page.
        location ^~ /unmask/ {
            proxy_pass http://unmask_backend;
            proxy_set_header Host             $host;
            proxy_set_header X-Original-Host  $host;
            proxy_set_header X-Real-IP        $remote_addr;
            proxy_pass_request_headers on;
        }
    }

    server {
        listen 8444 ssl;
        ssl_certificate     /etc/nginx/cert.pem;
        ssl_certificate_key /etc/nginx/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        server_name blog.local;

        location / {
            auth_request /_unmask_check;
            error_page 401 = @unmask_challenge;
            error_page 403 = @unmask_blocked;
            # see shop.local note: try_files punts to a named location so
            # auth_request actually runs (= a top-level `return 200` runs in
            # REWRITE phase, before auth_request).
            try_files /__nonexistent @blog_origin;
        }
        location @blog_origin {
            default_type text/plain;
            return 200 "[blog.local OK $request_uri]\n";
        }
        location = /_unmask_check {
            internal;
            proxy_pass http://unmask_backend/unmask/api/check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host             $host;
            proxy_set_header X-Original-URI   $request_uri;
            proxy_set_header X-Original-IP    $remote_addr;
            proxy_set_header X-Original-UA    $http_user_agent;
            proxy_set_header X-Original-Host  $host;
            proxy_set_header Cookie           $http_cookie;
            proxy_intercept_errors on;
            error_page 502 503 504 = @unmask_fail_open;
        }
        location @unmask_challenge {
            rewrite ^ /unmask/challenge/?_orig=$request_uri break;
            proxy_pass http://unmask_backend;
            proxy_set_header Host             $host;
            proxy_set_header X-Original-Host  $host;
        }
        location @unmask_blocked {
            default_type text/plain;
            return 403 "denied\n";
        }
        location @unmask_fail_open {
            default_type text/plain;
            return 200 "[blog.local fail-open $request_uri]\n";
        }
        location ^~ /unmask/ {
            proxy_pass http://unmask_backend;
            proxy_set_header Host             $host;
            proxy_set_header X-Original-Host  $host;
            proxy_pass_request_headers on;
        }
    }

    server {
        listen 8444 ssl;
        ssl_certificate     /etc/nginx/cert.pem;
        ssl_certificate_key /etc/nginx/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        server_name default.example;

        # The "no-override" vhost.  Branding falls through to the top-level
        # default ("Default Co"); the default protected_paths /admin/ applies.
        location / {
            auth_request /_unmask_check;
            error_page 401 = @unmask_challenge;
            try_files /__nonexistent @default_origin;
        }
        location @default_origin {
            default_type text/plain;
            return 200 "[default.example OK $request_uri]\n";
        }
        location = /_unmask_check {
            internal;
            proxy_pass http://unmask_backend/unmask/api/check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host             $host;
            proxy_set_header X-Original-URI   $request_uri;
            proxy_set_header X-Original-IP    $remote_addr;
            proxy_set_header X-Original-UA    $http_user_agent;
            proxy_set_header X-Original-Host  $host;
            proxy_set_header Cookie           $http_cookie;
            proxy_intercept_errors on;
            error_page 502 503 504 = @unmask_fail_open;
        }
        location @unmask_challenge {
            rewrite ^ /unmask/challenge/?_orig=$request_uri break;
            proxy_pass http://unmask_backend;
            proxy_set_header Host             $host;
            proxy_set_header X-Original-Host  $host;
        }
        location @unmask_fail_open {
            default_type text/plain;
            return 200 "[default.example fail-open $request_uri]\n";
        }
        location ^~ /unmask/ {
            proxy_pass http://unmask_backend;
            proxy_set_header Host             $host;
            proxy_set_header X-Original-Host  $host;
            proxy_pass_request_headers on;
        }
    }
}

# e2e forward-auth nginx (= STOCK nginx, NO unmask plugin).
#
# Exercises the nginx forward-auth JA4 gate end-to-end, the path the native
# nginx container (with the plugin) does NOT cover:
#   client -> fa-nginx -> auth_request /_unmask/check -> admin
#
# forward-auth-lbtrust.conf (rendered by the admin from nginx.trusted_lb_*)
# decides whether a forwarded X-Client-JA4 is adopted into $unmask_fa_ja4, and
# the shipped forward-auth/server.inc forwards that gated value to the daemon.
# Scenario 42 drives this.  Stock nginx already ships the realip + auth_request
# modules, so no custom build is needed.
worker_processes 1;
error_log  /var/log/nginx/error.log warn;
pid        /run/nginx.pid;
events { worker_connections 256; }

http {
    access_log off;

    # Rendered by the admin container into the shared /etc/unmask volume
    # (output_dir: /etc/unmask in admin.yml):
    include /etc/unmask/upstream.conf;              # upstream unmask_admin -> admin:9477
    include /etc/unmask/forward-auth-lbtrust.conf;  # geo + map -> $unmask_fa_ja4 (LB-gated)

    server {
        listen 8082;
        server_name _;

        # Trust XFF so a scenario can present a fresh client IP per case and
        # isolate ban / honeypot state.  This does NOT weaken the gate: the gate
        # keys on $realip_remote_addr (the real TCP peer, evaluated BEFORE this
        # rewrite), while $remote_addr / X-Original-IP become the XFF value.
        set_real_ip_from 0.0.0.0/0;
        real_ip_header   X-Forwarded-For;

        # admin UI / challenge / api / static / _unmask/check mounts.
        include /etc/unmask-fa/server.inc;

        # Protected backend: auth_request gates it.  pass -> the static backend
        # body (200); a bot verdict -> 401 -> @unmask_to_challenge ->
        # /unmask/challenge/.  NOTE: a `return 200` here would NOT work -- return
        # runs in the rewrite phase, BEFORE auth_request's access phase, so it
        # would short-circuit the check.  Serving a real file (content phase, runs
        # AFTER access) is what every protected location must do.
        location / {
            include /etc/unmask-fa/protect.inc;
            root  /usr/share/nginx/html;
            index index.html;
        }
    }
}

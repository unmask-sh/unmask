# Compose override for the "TLS terminated in front" shape: the daemon seeds
# settings > Gateway with tls_mode none, and nginx serves :80 only.  Used by
# CI on top of docker-compose.example.yml.
services:
  unmask:
    environment:
      UNMASK_SERVER_NAME: example.test
      UNMASK_TLS_MODE: none
      UNMASK_TRUSTED_PROXIES: "172.16.0.0/12"

# Stock nginx: the SAME binary as the unmask container (same build, same
# OpenSSL, same cert), with the module not loaded and no unmask config included.
#
# That is the whole point of it.  Comparing against nginx:alpine or against a
# vhost inside the module-loaded process would each measure something else --
# a different build in one case, and in the other a process that still pays
# whatever the module costs at connection setup.  Same binary, one difference.
worker_processes 1;
# The e2e build passes no --prefix / --pid-path / --*-temp-path, so nginx still
# wants /usr/local/nginx/... which the runtime image does not have.  Same
# overrides the main config carries, for the same reason.
pid /run/nginx-stock.pid;
error_log /var/log/nginx/stock-error.log crit;
events { worker_connections 1024; }
http {
    client_body_temp_path /var/lib/nginx/body;
    proxy_temp_path       /var/lib/nginx/proxy;
    fastcgi_temp_path     /var/lib/nginx/fastcgi;
    uwsgi_temp_path       /var/lib/nginx/uwsgi;
    scgi_temp_path        /var/lib/nginx/scgi;
    access_log off;
    server {
        listen 8446 ssl;
        ssl_certificate     /etc/nginx/cert.pem;
        ssl_certificate_key /etc/nginx/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        location = /__unmask_perf {
            default_type text/plain;
            return 200 "perf";
        }
        location / { return 404; }
    }
}

# nginx config for e2e docker.  Not for production (= reference implementation
# of the distribution).
#
# Setup:
#   - Load unmask.so via load_module
#   - Include nginx-rendered.conf / nginx-rendered-server.conf rendered by admin
#   - admin runs in a separate service; /etc/unmask is on a shared volume.

load_module /usr/lib/nginx/modules/ngx_http_unmask_module.so;
worker_processes 1;
events {}
http {
    log_format main '$remote_addr [$time_local] "$request" $status '
                    'ja4=$client_ja4 v=$ja4_verdict bv=$bv_valid';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # http {} conf rendered by the admin container.  Includes upstream / map / log_format.
    include /etc/unmask/nginx-rendered.conf;

    # In docker compose the service name "admin" resolves.
    # Override the upstream rendered upstream (= unnecessary if e2e admin.yml
    # sets upstream_addr to admin:9477, but redeclared here as a safety net
    # against docker DNS resolution quirks).
    upstream unmask_admin {
        server admin:9477;
        keepalive 8;
    }

    # Presence of the PoW-pass cookie _br.  Real HMAC verification will land
    # in a future ja4-module extension.
    map $cookie__br $bot_challenge_passed {
        default "1";
        ""      "0";
    }

    server {
        listen 8443 ssl;
        ssl_certificate     /etc/nginx/cert.pem;
        ssl_certificate_key /etc/nginx/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        include /etc/unmask/nginx-rendered-server.conf;

        location / {
            limit_req zone=unmask_rate burst=50 nodelay;
            error_page 429 = @unmask_rate_challenge;
            if ($final_challenge = 1) {
                rewrite ^ /unmask/challenge/ last;
            }
            default_type text/plain;
            return 200 "[unmask e2e]\nja4=$client_ja4\nv=$ja4_verdict\nbv=$bv_valid\nhp=$serve_bot_challenge\nfc=$final_challenge\n";
        }
    }
}

# nginx config for e2e docker.  Not for production (= reference implementation
# of the distribution).
#
# Setup:
#   - Load unmask.so via load_module
#   - Include /etc/unmask/{http.inc,server.inc} rendered by admin
#   - admin runs in a separate service; /etc/unmask is on a shared volume.

load_module /usr/lib/nginx/modules/ngx_http_unmask_module.so;
worker_processes 1;
# Override compiled-in default paths (= the e2e build of nginx didn't pass
# --pid-path / --error-log-path, so nginx still uses /usr/local/nginx/logs/ —
# which doesn't exist in the runtime image).
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;
events {}
http {
    # Override default-prefix paths (the e2e build didn't pass --client-body-temp-path
    # etc. at ./configure, so nginx still wants to mkdir /usr/local/nginx/...).
    client_body_temp_path /var/lib/nginx/body;
    proxy_temp_path       /var/lib/nginx/proxy;
    fastcgi_temp_path     /var/lib/nginx/fastcgi;
    uwsgi_temp_path       /var/lib/nginx/uwsgi;
    scgi_temp_path        /var/lib/nginx/scgi;

    log_format main '$remote_addr [$time_local] "$request" $status '
                    'ja4=$effective_ja4 v=$ja4_verdict bv=$bv_any_valid';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # http {} conf rendered by the admin container.  Provides $is_search_bot /
    # $ja4_verdict / $ja4_action / $bv_kind / $final_challenge / $rate_limit_key
    # maps, plus the limit_req_zone definition and the `upstream unmask {}`
    # block (= server admin:9477; via nginx.upstream_addr in admin.yml).
    include /etc/unmask/http.inc;

    # forward-auth LB-trust gate (geo/map over $realip_remote_addr).  The
    # web-nginx package wires this in BOTH modes via a conf.d symlink that sorts
    # AFTER http.inc (zz-unmask-fa-lbtrust.conf > 00-unmask.conf) -- because nginx
    # pins map_hash_bucket_size at the first map/geo it parses, so http.inc's
    # sizing must come first.  Replicate that real layout here (include AFTER
    # http.inc) so `nginx -t` exercises the native+gate coexistence the package
    # produces -- the path the 2026-06-28 map_hash regression slipped through.
    include /etc/unmask/forward-auth-lbtrust.conf;

    # Presence of the PoW-pass cookie _br.  Real HMAC verification will land
    # in a future ja4-module extension.
    map $cookie__br $bot_challenge_passed {
        default "1";
        ""      "0";
    }

    # Fake Web Bot Auth operator (scenario 34).  Serves the JWK directory the
    # admin daemon fetches to verify e2e-signed requests.  TLS because the
    # verifier only accepts https agent URLs; the admin image trusts the e2e
    # CA via its system store (= the operator-provisions-the-CA posture, same
    # as production).  Reached as https://nginx:9444/ on the compose network
    # only — never published to the host.
    server {
        listen 9444 ssl;
        ssl_certificate     /etc/wba/operator.crt;
        ssl_certificate_key /etc/wba/operator.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        location = /.well-known/http-message-signatures-directory {
            default_type application/http-message-signatures-directory;
            alias /etc/wba/directory.json;
        }
        location / { return 404; }
    }

    server {
        listen 8443 ssl;
        ssl_certificate     /etc/nginx/cert.pem;
        ssl_certificate_key /etc/nginx/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # e2e-only: trust X-Forwarded-For so a scenario can present a distinct
        # source IP per case (= isolation from honeypot / ban state left on the
        # shared docker IP by earlier scenarios).  Requests without XFF are
        # unaffected, so scenarios 01-13 keep seeing the real $remote_addr.
        set_real_ip_from 0.0.0.0/0;
        real_ip_header   X-Forwarded-For;

        # server.inc provides the access_log, @unmask_rate_challenge, and the
        # `location ^~ /unmask/` proxy to the admin daemon (challenge HTML /
        # verify API / static / healthz).  Native mode is self-contained — no
        # hand-written /unmask/ block needed.
        include /etc/unmask/server.inc;

        # Debug echo of resolution variables.  Used only by the e2e harness.
        location = /__unmask_debug {
            default_type text/plain;
            return 200 "ja4=$effective_ja4\nv=$ja4_verdict\na=$ja4_action\nbv=$bv_any_valid\nbv_kind=$bv_kind\nis_known_browser=$is_known_browser\nis_challenge_target=$is_challenge_target\nis_search_bot=$is_search_bot\nprotected_mode_eff=$protected_mode_eff\nserve_bot_challenge=$serve_bot_challenge\nunmatched_chain_action=$unmatched_chain_action\nunmatched_should_challenge=$unmatched_should_challenge\nfc=$final_challenge\nsigned=$unmask_has_signed_agent\ngate=$unmask_signed_gate\nsa=$unmask_signed_action\nfce=$final_challenge_eff\n";
        }
        location / {
            include /etc/unmask/protect.inc;
            # `return 200` in REWRITE phase finalizes the request before
            # PREACCESS where limit_req runs, so the rate-limit never fires.
            # try_files runs in PRECONTENT (= after PREACCESS), so the
            # named @echo path lets limit_req engage normally.
            try_files /__nonexistent @echo;
        }
        location @echo {
            default_type text/plain;
            return 200 "[unmask e2e]\nja4=$effective_ja4\nv=$ja4_verdict\nbv=$bv_any_valid\nhp=$serve_bot_challenge\nfc=$final_challenge\n";
        }
    }

    # e2e-only vhost for scenario 48: protect.inc included at SERVER scope (the
    # "whole site" install example / the misplacement that self-DoS'd unmask.sh
    # on 2026-07-02).  Regression guard for the machinery-bypass fix: with the
    # `if ($uri ~ "^/unmask/") { break; }` guard, /unmask/* machinery (verify /
    # challenge.js) must still reach `location ^~ /unmask/` instead of being
    # rewritten into the challenge (which would loop every human).  The site
    # body must still be challenged.
    server {
        listen 8444 ssl;
        ssl_certificate     /etc/nginx/cert.pem;
        ssl_certificate_key /etc/nginx/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        set_real_ip_from 0.0.0.0/0;
        real_ip_header   X-Forwarded-For;

        include /etc/unmask/server.inc;
        include /etc/unmask/protect.inc;   # ← SERVER scope (the risky placement)

        location / {
            try_files /__nonexistent @echo48;
        }
        location @echo48 {
            default_type text/plain;
            return 200 "[unmask e2e srv-scope]\nfc=$final_challenge\n";
        }
    }
}
